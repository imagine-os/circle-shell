<title>Maker Circle</title>
<meta name="description" content="Circle shell rebuild: a static front-end recreation of the Circle community app shell with mock data.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --brand:#506CF0; --brand-ink:#3E57D6; --brand-soft:#EEF1FE; --brand-text:#FFFFFF;
  --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#F3F4F6; --hover:#F1F2F5; --active:#E9ECF8;
  --border:#E6E8EC; --border-strong:#D5D8DF;
  --text:#191B1F; --text-2:#4B5563; --muted:#6B7280; --faint:#9CA3AF;
  --danger:#E5484D; --success:#2FA36B; --warn:#E0A100;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.08);
  --sidebar-bg:#FFFFFF; --sidebar-w:280px; --rail-w:300px; --main-w:680px; --topbar-h:64px;
  --radius:12px; --radius-sm:8px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --cover:linear-gradient(120deg,#506CF0 0%,#8B5CF6 55%,#EC4899 100%);
  --stage:#0E1016; --stage-2:#1A1D26; --stage-3:#262A36; --stage-text:#F3F4F6; --stage-muted:#9AA0AE; --stage-border:#2B2F3B;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand:#7B8FF5; --brand-ink:#98A8F8; --brand-soft:#262B45; --brand-text:#0F1120;
    --bg:#191B1F; --surface:#22252B; --surface-2:#2A2D34; --hover:#2C2F37; --active:#2E3350;
    --border:#33363D; --border-strong:#44474F;
    --text:#F3F4F6; --text-2:#C9CDD4; --muted:#9CA3AF; --faint:#6B7280;
    --danger:#F0616A; --success:#4CC38A; --warn:#F2B93B;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
    --sidebar-bg:#1E2025;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#7B8FF5; --brand-ink:#98A8F8; --brand-soft:#262B45; --brand-text:#0F1120;
  --bg:#191B1F; --surface:#22252B; --surface-2:#2A2D34; --hover:#2C2F37; --active:#2E3350;
  --border:#33363D; --border-strong:#44474F;
  --text:#F3F4F6; --text-2:#C9CDD4; --muted:#9CA3AF; --faint:#6B7280;
  --danger:#F0616A; --success:#4CC38A; --warn:#F2B93B;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  --sidebar-bg:#1E2025;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ---------- App frame ---------- */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100%;min-height:100%}
.sidebar{background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;position:sticky;top:0;overflow:hidden}
.side-scroll{flex:1;overflow-y:auto;padding:8px 12px 12px}
.content{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.page{flex:1;overflow-y:auto;overflow-x:hidden}
.page-inner{max-width:calc(var(--main-w) + var(--rail-w) + 24px);margin:0 auto;padding:24px 16px 40px;display:grid;grid-template-columns:minmax(0,var(--main-w)) var(--rail-w);gap:24px;align-items:start}
.page-inner.wide{grid-template-columns:minmax(0,1fr)}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.rail{position:sticky;top:0;display:flex;flex-direction:column;gap:16px}

/* ---------- Sidebar ---------- */
.community{display:flex;align-items:center;gap:10px;width:100%;padding:14px 12px;height:var(--topbar-h);border-bottom:1px solid var(--border);text-align:left}
.community:hover{background:var(--hover)}
.logo{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--brand-text);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.community .name{font-weight:600;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.community .ico{color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:var(--radius-sm);color:var(--text-2);font-weight:500;text-align:left;position:relative;line-height:1.3}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--active);color:var(--brand-ink)}
:root[data-theme="dark"] .nav-item[aria-current="page"]{color:#C7D0FF}
.nav-item .ico{color:inherit;opacity:.85}
.nav-item .emoji{width:20px;text-align:center;font-size:15px;flex:none}
.nav-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.group{margin-top:14px}
.group-h{display:flex;align-items:center;gap:6px;width:100%;padding:6px 10px 6px 8px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-radius:var(--radius-sm)}
.group-h:hover{color:var(--text);background:var(--hover)}
.group-h .ico{transition:transform .18s}
.group[data-open="false"] .group-h .ico{transform:rotate(-90deg)}
.group[data-open="false"] .group-list{display:none}
.group-list{display:flex;flex-direction:column;gap:1px}
.side-foot{border-top:1px solid var(--border);padding:10px 12px}
.me-row{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:var(--radius-sm);text-align:left}
.me-row:hover{background:var(--hover)}
.me-row .who{flex:1;min-width:0}
.me-row .who b{display:block;font-weight:600;font-size:13px}
.me-row .who span{font-size:12px;color:var(--muted)}
.powered{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:var(--faint);padding:8px 0 2px}
.powered i{width:12px;height:12px;border-radius:50%;border:2.5px solid currentColor;display:inline-block}

/* ---------- Avatars ---------- */
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none;letter-spacing:.01em;user-select:none}
.av.xs{width:24px;height:24px;font-size:10px}
.av.sm{width:28px;height:28px;font-size:11px}
.av.lg{width:48px;height:48px;font-size:17px}
.av.xl{width:64px;height:64px;font-size:22px}
.stack{display:flex}
.stack .av{border:2px solid var(--surface);margin-left:-6px}
.stack .av:first-child{margin-left:0}

/* ---------- Top bar ---------- */
.topbar{height:var(--topbar-h);border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 20px;flex:none}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:16px}
.crumb .sub{font-weight:400;color:var(--muted);font-size:14px}
.crumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .type-badge{flex:none;overflow:visible}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:0 10px;height:38px;width:280px;color:var(--muted)}
.search:hover{border-color:var(--border-strong)}
.search:focus-within{border-color:var(--brand);background:var(--surface)}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;color:var(--text)}
.search input::placeholder{color:var(--muted)}
kbd{font:inherit;font-size:11px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface)}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);position:relative}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn[aria-expanded="true"]{background:var(--active);color:var(--brand-ink)}
.badge{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface);line-height:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;font-weight:600;font-size:13.5px;border:1px solid transparent;white-space:nowrap}
.btn.primary{background:var(--brand);color:var(--brand-text)}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{border-color:var(--border-strong);background:var(--surface);color:var(--text)}
.btn.ghost:hover{background:var(--hover)}
.btn.soft{background:var(--surface-2);color:var(--text)}
.btn.soft:hover{background:var(--hover)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.on{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
.btn .ico{width:16px;height:16px}
.hamb{display:none}

/* ---------- Dropdowns ---------- */
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:6px;z-index:60}
.menu.left{left:0;right:auto}
.menu button,.menu a{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;font-weight:500;color:var(--text-2)}
.menu button:hover,.menu a:hover{background:var(--hover);color:var(--text)}
.menu button .ico{width:17px;height:17px;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
.menu .hd{padding:6px 10px 4px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.menu button.danger{color:var(--danger)}
.menu button .check{margin-left:auto;color:var(--brand)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.card-h .more{flex:none}
.card-h h3{font-size:14px}
.card-h .more{font-size:12.5px;color:var(--brand-ink);font-weight:500}
.card-b{padding:12px 16px 16px}

/* Space header */
.space-head{overflow:hidden}
.cover{height:96px;background:var(--cover)}
.space-body{padding:0 20px 0;position:relative}
.space-row{display:flex;align-items:flex-start;gap:14px}
.space-emoji{margin-top:-28px;width:64px;height:64px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);display:grid;place-items:center;font-size:30px}
.space-meta{flex:1;min-width:0;padding-top:10px}
.space-meta h1{font-size:20px;line-height:1.25}
.space-meta p{color:var(--muted);font-size:13.5px;margin-top:2px}
.space-actions{display:flex;align-items:center;gap:10px;padding-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);font-weight:600;font-size:12.5px}
.tabs{display:flex;gap:4px;margin-top:12px;border-top:1px solid var(--border);padding-top:4px}
.tab{padding:10px 12px;font-weight:500;color:var(--muted);position:relative;border-radius:8px 8px 0 0}
.tab:hover{color:var(--text);background:var(--hover)}
.tab[aria-selected="true"]{color:var(--text);font-weight:600}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--brand);border-radius:2px}
.member-note{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:8px}

/* Composer */
.composer{padding:12px 16px}
.composer-row{display:flex;align-items:center;gap:12px}
.composer-input{flex:1;height:44px;border-radius:10px;background:var(--surface-2);color:var(--muted);text-align:left;padding:0 14px;font-size:14.5px;border:1px solid transparent}
.composer-input:hover{border-color:var(--border-strong)}
.composer textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;outline:none}
.composer textarea:focus{border-color:var(--brand)}
.composer-tools{display:flex;align-items:center;gap:4px;margin-top:10px}
.tool{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.tool:hover{background:var(--hover);color:var(--text)}
.composer-open{display:none}
.composer[data-open="true"] .composer-row{display:none}
.composer[data-open="true"] .composer-open{display:block}
.composer-foot{display:flex;align-items:center;gap:8px;margin-top:10px}
.composer-foot .btn{margin-left:auto}
.composer-foot .btn + .btn{margin-left:0}

/* Sort row */
.sort-row{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-weight:500;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.sort-row .count{margin-left:auto}

/* Post card */
.post{padding:16px 20px 12px;display:flex;flex-direction:column;gap:12px}
.post.pinned{border-color:var(--brand);border-width:1px}
.post-top{display:flex;align-items:flex-start;gap:12px}
.post-who{flex:1;min-width:0}
.post-who .n{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.post-who .n .role{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--brand-soft);color:var(--brand-ink)}
.post-who .m{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.post-who .m .sp{color:var(--brand-ink);font-weight:500}
.pin-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--brand-ink);font-weight:600}
.post h2{font-size:17px;line-height:1.35;letter-spacing:-.005em}
.post .body{color:var(--text-2);font-size:14.5px;white-space:pre-line}
.post .body b{color:var(--text)}
.media{border-radius:10px;aspect-ratio:16/8;max-width:100%;position:relative;overflow:hidden;background:var(--surface-2)}
.media .cap{position:absolute;left:12px;bottom:10px;font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:6px}
.reacts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.react{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}
.react[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.react:hover{border-color:var(--border-strong)}
.actions{display:flex;align-items:center;gap:2px;border-top:1px solid var(--border);padding-top:8px;margin-top:-2px}
.act{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:8px;color:var(--muted);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.act:hover{background:var(--hover);color:var(--text)}
.act[aria-pressed="true"]{color:var(--brand-ink)}
.act[aria-pressed="true"] .ico{fill:currentColor}
.act.right{margin-left:auto}
.act.icon-only{width:34px;padding:0;justify-content:center}

/* Poll */
.poll{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:10px;overflow:hidden;text-align:left;font-weight:500}
.opt .bar{position:absolute;inset:0;width:var(--w,0%);background:var(--brand-soft);transition:width .35s}
.opt span{position:relative;z-index:1}
.opt .pct{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.opt[aria-checked="true"]{border-color:var(--brand)}
.opt[aria-checked="true"] .pct{color:var(--brand-ink);font-weight:600}
.opt:hover{border-color:var(--border-strong)}
.poll-meta{font-size:12.5px;color:var(--muted)}

/* Event block */
.ev{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.date-chip{width:52px;height:56px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.date-chip b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.date-chip span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--danger);font-weight:700;margin-bottom:3px}
.ev-meta{flex:1;min-width:0}
.ev-meta b{display:block;font-weight:600}
.ev-meta span{font-size:12.5px;color:var(--muted);display:block}

/* Course progress block */
.course-inline{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:10px}
.course-thumb{width:72px;height:56px;border-radius:8px;flex:none;background:linear-gradient(135deg,#F59E0B,#EF4444)}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:var(--w,0%);background:var(--brand);border-radius:3px}
.prog-lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-top:5px;font-variant-numeric:tabular-nums}

/* Comments */
.comments{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border);padding-top:12px}
.cm{display:flex;gap:10px}
.cm .bubble{flex:1;min-width:0}
.cm .bubble .hd{display:flex;align-items:baseline;gap:8px;font-size:13px}
.cm .bubble .hd b{font-weight:600}
.cm .bubble .hd span{color:var(--muted);font-size:12px}
.cm .bubble p{color:var(--text-2);font-size:13.5px;margin-top:2px}
.cm .bubble .cm-acts{display:flex;gap:12px;margin-top:4px;font-size:12px;color:var(--muted);font-weight:500}
.cm .bubble .cm-acts button:hover{color:var(--text)}
.cm .nested{margin-top:10px;display:flex;gap:10px}
.cm-input{display:flex;gap:10px;align-items:center}
.cm-input input{flex:1;height:36px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);padding:0 14px;outline:none}
.cm-input input:focus{border-color:var(--brand);background:var(--surface)}
.view-all{font-size:13px;color:var(--brand-ink);font-weight:500;align-self:flex-start}

/* Right rail widgets */
.about-meta{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:13px;color:var(--text-2)}
.about-meta div{display:flex;align-items:center;gap:8px}
.about-meta .ico{width:16px;height:16px;color:var(--muted)}
.rail-ev{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.rail-ev:first-of-type{border-top:0;padding-top:4px}
.rail-ev .date-chip{width:46px;height:50px}
.rail-ev .date-chip b{font-size:17px}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0}
.lb + .lb{border-top:1px solid var(--border)}
.rank{width:20px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;font-weight:600}
.rank.top{color:var(--warn)}
.lb .who{flex:1;min-width:0}
.lb .who b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .who span{font-size:12px;color:var(--muted)}
.pts{font-size:12.5px;font-weight:600;color:var(--brand-ink);font-variant-numeric:tabular-nums;background:var(--brand-soft);padding:2px 8px;border-radius:999px}
.trend{display:flex;gap:10px;padding:8px 0;align-items:flex-start;width:100%;text-align:left;border-radius:8px}
.trend + .trend{border-top:1px solid var(--border)}
.trend .n{width:22px;font-size:12px;font-weight:700;color:var(--faint);margin-top:2px}
.trend .t{flex:1;min-width:0}
.trend .t b{display:block;font-weight:600;font-size:13.5px;line-height:1.35}
.trend .t span{font-size:12px;color:var(--muted)}

/* Members view */
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filterbar .search{width:min(320px,100%)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:500;font-size:13px;color:var(--text-2)}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.member{padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.member b{font-weight:600;margin-top:6px}
.member .hl{font-size:12.5px;color:var(--muted);min-height:36px}
.member .stat{font-size:12px;color:var(--faint)}
.member .btns{display:flex;gap:8px;margin-top:8px;width:100%}
.member .btns .btn{flex:1}
.online{position:relative}
.online::after{content:"";position:absolute;right:2px;bottom:2px;width:12px;height:12px;border-radius:50%;background:var(--success);border:2px solid var(--surface)}

/* Events view */
.event-card{display:flex;gap:16px;padding:16px;align-items:center}
.event-card .date-chip{width:64px;height:68px}
.event-card .date-chip b{font-size:24px}
.event-card .info{flex:1;min-width:0}
.event-card .info h3{font-size:16px}
.event-card .info .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:4px}
.event-card .info .meta span{display:inline-flex;align-items:center;gap:5px}
.event-card .going{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.event-card .rs{display:flex;flex-direction:column;gap:6px;align-items:flex-end}

/* Courses view */
.course{overflow:hidden;display:flex;flex-direction:column}
.course .cov{height:120px;background:var(--cover)}
.course .cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.course .cb h3{font-size:15.5px}
.course .cb p{font-size:13px;color:var(--muted)}
.course .cb .btn{margin-top:auto;align-self:flex-start}
.two{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

/* About view */
.about{padding:20px;display:flex;flex-direction:column;gap:12px;color:var(--text-2);font-size:14.5px}
.about h3{color:var(--text);font-size:15px}
.about ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* Drawer / overlays */
.scrim{position:fixed;inset:0;background:rgba(16,18,24,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:80;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.show{transform:none}
.drawer-h{height:var(--topbar-h);display:flex;align-items:center;gap:8px;padding:0 12px 0 20px;border-bottom:1px solid var(--border)}
.drawer-h h2{font-size:16px;flex:1}
.drawer-h .link{font-size:13px;color:var(--brand-ink);font-weight:500;padding:6px 8px;border-radius:6px}
.drawer-h .link:hover{background:var(--hover)}
.drawer-b{flex:1;overflow-y:auto}
.notif{display:flex;gap:12px;width:100%;padding:12px 20px;text-align:left;border-bottom:1px solid var(--border);align-items:flex-start;position:relative}
.notif:hover{background:var(--hover)}
.notif .txt{flex:1;min-width:0;font-size:13.5px;color:var(--text-2)}
.notif .txt b{color:var(--text);font-weight:600}
.notif .txt span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.notif[data-unread="true"]{background:var(--brand-soft)}
.notif[data-unread="true"]::after{content:"";position:absolute;right:16px;top:20px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.notif[data-unread="true"]:hover{background:var(--active)}
.notif .kind{position:absolute;left:44px;top:34px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:10px}
.notif-tabs{display:flex;gap:4px;padding:8px 20px;border-bottom:1px solid var(--border)}

/* DM popover */
.dm{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 32px));height:min(520px,calc(100% - 100px));background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);z-index:65;display:flex;flex-direction:column;overflow:hidden}
.dm-h{height:52px;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;border-bottom:1px solid var(--border)}
.dm-h h2{font-size:15px;flex:1;display:flex;align-items:center;gap:8px}
.dm-b{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.conv{display:flex;gap:10px;align-items:center;width:100%;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border)}
.conv:hover{background:var(--hover)}
.conv .t{flex:1;min-width:0}
.conv .t b{display:flex;justify-content:space-between;font-weight:600;font-size:13.5px}
.conv .t b span{font-weight:400;color:var(--muted);font-size:12px}
.conv .t p{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.conv[data-unread="true"] .t p{color:var(--text);font-weight:500}
.thread{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13.5px;background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--brand);color:var(--brand-text);align-self:flex-end;border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.msg time{display:block;font-size:10.5px;opacity:.7;margin-top:2px}
.dm-in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border)}
.dm-in input{flex:1;height:38px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);padding:0 14px;outline:none;min-width:0}
.dm-in input:focus{border-color:var(--brand);background:var(--surface)}

/* Command palette */
.palette{position:fixed;inset:0;z-index:90;display:flex;justify-content:center;align-items:flex-start;padding:min(14vh,120px) 16px 16px;background:rgba(16,18,24,.5)}
.pal{width:min(600px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;max-height:min(520px,100%);display:flex;flex-direction:column}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;height:56px;border-bottom:1px solid var(--border);color:var(--muted)}
.pal-in input{flex:1;border:0;background:transparent;font-size:16px;outline:none;color:var(--text);min-width:0}
.pal-list{overflow-y:auto;padding:8px}
.pal-hd{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px 10px 4px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.pal-item:hover,.pal-item[aria-selected="true"]{background:var(--hover)}
.pal-item .emoji{width:24px;text-align:center}
.pal-item .t{flex:1;min-width:0}
.pal-item .t b{display:block;font-weight:500}
.pal-item .t span{font-size:12px;color:var(--muted)}
.pal-item kbd{margin-left:auto}
.pal-empty{padding:24px;text-align:center;color:var(--muted)}
.pal-foot{display:flex;gap:14px;padding:8px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;font-size:13.5px;box-shadow:var(--shadow-lg);z-index:100;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:36px;margin-bottom:8px}

/* ---------- Space types ---------- */
.type-ico{color:var(--faint);display:inline-flex;flex:none}
.nav-item:hover .type-ico,.nav-item[aria-current="page"] .type-ico{color:inherit}
.type-badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.type-badge .ico{width:13px;height:13px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}70%{box-shadow:0 0 0 7px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
.live-badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;flex:none}
.live-badge i{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.live-now{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:13px;color:var(--text);white-space:nowrap}
.live-now:hover{background:var(--hover)}
.page-inner.full{grid-template-columns:minmax(0,1fr);max-width:none;padding:0;height:100%;align-items:stretch}
.page-inner.full .main{gap:0;height:100%;min-height:0}
.page-inner.wide .rail,.page-inner.full .rail{display:none}
.compact-h{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex:none;flex-wrap:wrap}
.page-inner:not(.full) .compact-h{border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.compact-h h1{font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.compact-h .desc{color:var(--muted);font-size:13px;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-h .tabs{margin:0;border:0;padding:0;gap:2px}
.compact-h .tab{padding:6px 10px;border-radius:8px}
.compact-h .tab[aria-selected="true"]::after{display:none}
.compact-h .tab[aria-selected="true"]{background:var(--active);color:var(--brand-ink)}
.space-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- Live room ---------- */
.room{display:flex;flex-direction:column;height:100%;min-height:600px;background:var(--stage);color:var(--stage-text)}
.room-h{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--stage-border);flex:none;flex-wrap:wrap}
.room-h h1{font-size:15px;display:flex;align-items:center;gap:8px}
.room-h .meta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--stage-muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.room-h .meta .rec{color:#F87171;display:inline-flex;align-items:center;gap:5px;font-weight:600;letter-spacing:.04em}
.room-h .meta .rec i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.room-h .r{margin-left:auto;display:flex;gap:4px}
.sbtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--stage-muted)}
.sbtn:hover,.sbtn[aria-pressed="true"]{background:var(--stage-3);color:var(--stage-text)}
.room-body{flex:1;display:flex;min-height:0;position:relative}
.stage{flex:1;min-width:0;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative;min-height:0}
.tiles{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(150px,1fr);gap:12px;min-height:0}
.tile{position:relative;border-radius:14px;overflow:hidden;background:var(--stage-2);display:grid;place-items:center;border:2px solid transparent;transition:border-color .2s,box-shadow .2s;min-width:0}
.tile[data-speaking="true"]{border-color:var(--success);box-shadow:0 0 0 3px rgba(76,195,138,.25)}
.tile .av.xl{width:clamp(48px,22%,96px);height:auto;aspect-ratio:1;font-size:clamp(16px,2.6vw,32px)}
.tile .nm{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;background:rgba(0,0,0,.5);color:#fff;font-size:12.5px;font-weight:500;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .nm .ico{width:14px;height:14px}
.ico.off{color:#F87171}
.tile .hand{position:absolute;top:10px;right:10px;font-size:18px;background:rgba(0,0,0,.5);border-radius:8px;padding:2px 6px;line-height:1.3}
.tile.share{grid-column:span 2;background:linear-gradient(135deg,#1E293B,#0F172A)}
.tile.share .shr{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:7px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:600;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.share .doc{width:min(78%,520px);margin-top:36px;aspect-ratio:16/9;border-radius:8px;background:var(--surface);color:var(--text);padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 50px rgba(0,0,0,.4);overflow:hidden}
.tile.share .doc b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.share .doc span{height:8px;border-radius:4px;background:var(--surface-2);display:block;flex:none}
.tile.share .doc span:nth-child(3){width:70%}.tile.share .doc span:nth-child(4){width:85%}.tile.share .doc span:nth-child(5){width:55%}
.tile .speak{position:absolute;right:10px;bottom:12px;display:flex;gap:2px;align-items:flex-end;height:16px}
.tile .speak i{width:3px;background:var(--success);border-radius:2px;height:6px;animation:eq .8s infinite ease-in-out}
.tile .speak i:nth-child(2){animation-delay:.15s}.tile .speak i:nth-child(3){animation-delay:.3s}
.tile[data-speaking="false"] .speak{display:none}
@keyframes eq{0%,100%{height:5px}50%{height:16px}}
.pip{position:relative;align-self:flex-end;flex:none;width:180px;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--stage-3);display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.5);border:2px solid var(--stage-border);z-index:2}
.pip .av{width:44px;height:44px;font-size:15px}
.pip[data-cam="true"]{background:linear-gradient(160deg,#334155,#0F172A)}
.pip[data-cam="true"] .av{display:none}
.fig{display:none;width:36%;aspect-ratio:1;border-radius:50% 50% 45% 45%;background:linear-gradient(180deg,#F1D3B3,#D9A97F);position:relative;top:14%}
[data-cam="true"] .fig{display:block}
.pip .nm{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:6px;background:rgba(0,0,0,.5);color:#fff;font-size:11.5px;font-weight:500}
.pip .nm .ico{width:13px;height:13px}
.pip .hand{position:absolute;top:6px;right:6px;font-size:16px;background:rgba(0,0,0,.5);border-radius:6px;padding:1px 5px}
.muted-pill{position:absolute;left:16px;bottom:22px;background:rgba(0,0,0,.7);color:#fff;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center;z-index:2;white-space:nowrap}
.muted-pill .ico{width:14px;height:14px}
.room-ctl{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-top:1px solid var(--stage-border);flex:none;flex-wrap:wrap;position:relative}
.ctl{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;padding:6px 0;border-radius:10px;color:var(--stage-text);font-size:10.5px;font-weight:500}
.ctl .k{width:40px;height:40px;border-radius:50%;background:var(--stage-3);display:grid;place-items:center;transition:background .15s}
.ctl:hover .k{background:#3A4050}
.ctl[aria-pressed="true"] .k{background:var(--stage-text);color:var(--stage)}
.ctl.off .k{background:#F87171;color:#fff}
.ctl.leave{width:auto;padding:6px 4px}
.ctl.leave .k{background:var(--danger);color:#fff;width:auto;border-radius:20px;padding:0 18px}
.ctl.leave:hover .k{background:#C8393E}
.burst{position:absolute;bottom:90px;pointer-events:none;font-size:26px;animation:floatUp 1.7s ease-out forwards;z-index:4}
@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-20px) scale(1)}100%{transform:translateY(-240px) translateX(var(--dx,0)) scale(1.2);opacity:0}}
.react-tray{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:12px;background:var(--stage-3);box-shadow:var(--shadow-lg);z-index:3}
.react-tray button{width:38px;height:38px;border-radius:8px;font-size:20px}
.react-tray button:hover{background:#414757}
.room-panel{width:340px;flex:none;border-left:1px solid var(--stage-border);display:flex;flex-direction:column;background:var(--surface);color:var(--text);min-height:0}
.panel-tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--border);align-items:center}
.panel-tabs .tab{flex:1;text-align:center;font-size:13px;padding:8px 6px;white-space:nowrap}
.panel-b{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.pmsg{display:flex;gap:8px;font-size:13px}
.pmsg .t{min-width:0}
.pmsg .t b{font-weight:600;font-size:12.5px;margin-right:6px}
.pmsg .t span{color:var(--muted);font-size:11.5px}
.pmsg .t p{color:var(--text-2);margin-top:1px;overflow-wrap:anywhere}
.pmsg.sys{color:var(--muted);font-size:12px;justify-content:center;text-align:center}
.person{display:flex;align-items:center;gap:10px;padding:4px 0}
.person .who{flex:1;min-width:0}
.person .who b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .who span{font-size:11.5px;color:var(--muted)}
.person .tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:5px;background:var(--brand-soft);color:var(--brand-ink);flex:none}
.person .st{display:flex;gap:4px;color:var(--muted)}
.person .st .ico{width:15px;height:15px}
.qa{padding:10px 12px;border:1px solid var(--border);border-radius:10px;display:flex;gap:10px}
.qa .up{display:flex;flex-direction:column;align-items:center;width:36px;height:48px;border-radius:8px;border:1px solid var(--border);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;justify-content:center;flex:none}
.qa .up[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
.qa .up .ico{width:14px;height:14px}
.qa .q{flex:1;min-width:0;font-size:13px}
.qa .q p{color:var(--text)}
.qa .q span{font-size:11.5px;color:var(--muted)}
.qa .q .ans{color:var(--success);font-weight:600}
.panel-in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border)}
.panel-in input{flex:1;height:36px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);padding:0 12px;outline:none;min-width:0}
.panel-in input:focus{border-color:var(--brand);background:var(--surface)}
.prejoin-wrap{flex:1;display:grid;place-items:center;padding:24px 16px;background:var(--stage);min-height:0}
.prejoin{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;width:min(880px,100%);padding:20px;align-items:center}
.preview{aspect-ratio:16/10;border-radius:14px;background:var(--stage-2);position:relative;display:grid;place-items:center;overflow:hidden;color:var(--stage-text);max-width:100%}
.preview[data-cam="true"]{background:linear-gradient(160deg,#334155,#0F172A)}
.preview .fig{width:34%;top:12%}
.preview[data-cam="true"] .av,.preview[data-cam="true"] .camoff{display:none}
.preview .inner{display:flex;flex-direction:column;align-items:center;gap:8px}
.preview .camoff{font-size:12.5px;color:var(--stage-muted)}
.preview .ctls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.preview .ctls .ctl{width:44px;padding:0}
.preview .ctls .ctl .l{display:none}
.prejoin-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.prejoin-side h2{font-size:20px}
.prejoin-side p{color:var(--muted);font-size:13.5px}
.prejoin-side label{font-size:12px;font-weight:600;color:var(--text-2)}
.prejoin-side input{height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);padding:0 12px;outline:none;width:100%}
.prejoin-side input:focus{border-color:var(--brand)}
.prejoin-side .btn{height:42px}

/* ---------- Live stream ---------- */
.stream-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.stream-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.player{aspect-ratio:16/9;max-width:100%;position:relative;overflow:hidden;background:linear-gradient(135deg,#1E1B4B 0%,#312E81 40%,#7C3AED 100%);color:#fff;display:grid;place-items:center}
.player .tl{position:absolute;top:12px;left:12px;display:flex;gap:8px;align-items:center;z-index:1}
.player .tl .type-badge{background:rgba(0,0,0,.5);color:#fff}
.player .tr{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;background:rgba(0,0,0,.5);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;z-index:1}
.player .tr .ico{width:14px;height:14px}
.player .wave{position:absolute;left:0;right:0;bottom:4px;height:70px;display:flex;align-items:flex-end;gap:3px;padding:0 16px 10px;opacity:.85}
.player .wave i{flex:1;background:rgba(255,255,255,.55);border-radius:2px 2px 0 0;height:var(--h,20%);animation:wave 1.1s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes wave{to{height:calc(var(--h,20%) * .35)}}
.player .center{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:0 24px;max-width:100%}
.player .center .big{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;backdrop-filter:blur(6px)}
.player .center .big .ico{width:28px;height:28px}
.player .center h2{font-size:clamp(15px,2.2vw,21px);text-shadow:0 2px 12px rgba(0,0,0,.4)}
.player .center .cd{font-size:clamp(28px,5vw,44px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1}
.player .center p{font-size:13px;opacity:.85}
.player .center .btn{margin-top:4px}
.player .bar{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,.2)}
.player .bar i{display:block;height:100%;width:100%;background:var(--danger)}
.player[data-mode="scheduled"] .bar i{width:0}
.host-row{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}
.host-row .who{flex:1;min-width:200px}
.host-row .who h2{font-size:16px;line-height:1.3}
.host-row .who p{color:var(--muted);font-size:13px;margin-top:2px}
.replay{display:flex;gap:12px;align-items:center;padding:10px 0;width:100%;text-align:left;border-radius:8px}
.replay + .replay{border-top:1px solid var(--border)}
.replay .th{width:128px;aspect-ratio:16/9;border-radius:8px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}
.replay .th .ico{width:26px;height:26px;fill:#fff;stroke:none;opacity:.9}
.replay .th .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);font-size:11px;padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.replay .t{flex:1;min-width:0}
.replay .t b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.replay .t span{font-size:12.5px;color:var(--muted)}
.schat{display:flex;flex-direction:column;height:min(640px,calc(100vh - 200px));min-height:380px;position:sticky;top:0}
.schat .hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
.schat .hd .count{margin-left:auto}
.schat .list{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.smsg{font-size:13px;display:flex;gap:8px;align-items:flex-start;animation:fadeIn .3s}
.smsg > div{min-width:0;overflow-wrap:anywhere}
.smsg b{font-weight:600;color:var(--brand-ink)}
.smsg.me b{color:var(--text)}
.smsg .av{width:22px;height:22px;font-size:9px;margin-top:1px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}

/* ---------- Chat space ---------- */
.chat{display:flex;flex-direction:column;height:100%;min-height:560px}
.chat-body{flex:1;display:flex;min-height:0;position:relative}
.chat-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.pinned-bar{display:flex;align-items:center;gap:10px;padding:8px 20px;background:var(--brand-soft);color:var(--brand-ink);font-size:13px;border-bottom:1px solid var(--border);flex:none}
.pinned-bar .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.pinned-bar .txt b{color:var(--brand-ink);font-weight:600}
.pinned-bar .ico{width:15px;height:15px;flex:none}
.chat-list{flex:1;overflow-y:auto;padding:12px 20px;display:flex;flex-direction:column;gap:2px;min-height:0}
.day-div{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;font-weight:600;margin:12px 0 8px}
.day-div::before,.day-div::after{content:"";flex:1;border-top:1px solid var(--border)}
.cmsg{display:flex;gap:12px;padding:6px 10px;margin:0 -10px;border-radius:10px;position:relative}
.cmsg:hover{background:var(--hover)}
.cmsg .b{flex:1;min-width:0}
.cmsg .hd{display:flex;align-items:baseline;gap:8px}
.cmsg .hd b{font-weight:600}
.cmsg .hd span{font-size:11.5px;color:var(--muted)}
.cmsg p{color:var(--text-2);font-size:14px;margin-top:1px;white-space:pre-line;overflow-wrap:anywhere}
.cmsg .hov{position:absolute;right:10px;top:-14px;display:none;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:2px}
.cmsg:hover .hov,.cmsg:focus-within .hov{display:flex}
.cmsg .hov button{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.cmsg .hov button:hover{background:var(--hover);color:var(--text)}
.cmsg .hov .ico{width:16px;height:16px}
.replies{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--brand-ink);padding:4px 8px 4px 4px;border-radius:8px;border:1px solid transparent}
.replies:hover{border-color:var(--border);background:var(--surface)}
.replies .stack .av{width:20px;height:20px;font-size:8px}
.replies .ago{color:var(--muted);font-weight:400}
.typing{display:flex;align-items:center;gap:8px;padding:4px 20px;font-size:12px;color:var(--muted);height:26px;flex:none}
.typing .dots{display:inline-flex;gap:3px}
.typing .dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:bounce 1s infinite}
.typing .dots i:nth-child(2){animation-delay:.15s}.typing .dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-4px);opacity:1}}
.chat-in{display:flex;flex-direction:column;gap:6px;padding:0 20px 16px;flex:none}
.chat-in .box{display:flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:4px 6px 4px 8px}
.chat-in .box:focus-within{border-color:var(--brand)}
.chat-in input{flex:1;border:0;background:transparent;outline:none;height:38px;min-width:0;padding:0 6px}
.chat-in .hint{font-size:11.5px;color:var(--faint);padding-left:4px}
.thread-panel{width:360px;flex:none;border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);min-height:0}
.thread-panel .hd{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--border);font-weight:600}
.thread-panel .hd h2{font-size:15px;flex:1}
.thread-panel .hd h2 span{color:var(--muted);font-weight:400;font-size:12.5px}
.thread-panel .list{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:4px;min-height:0}
.thread-panel .root{padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:6px;border-radius:0}
.thread-panel .root:hover{background:none}

/* ---------- Images space ---------- */
.masonry{columns:3 220px;column-gap:14px}
.gimg{break-inside:avoid;margin:0 0 14px;border-radius:12px;overflow:hidden;position:relative;display:block;width:100%;cursor:zoom-in;padding:0;text-align:left}
.gimg .ph{width:100%;aspect-ratio:var(--ar,1);display:block;transition:transform .3s}
.gimg:hover .ph{transform:scale(1.03)}
.gimg .who{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 3px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:500;backdrop-filter:blur(4px);max-width:calc(100% - 70px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gimg .who .av{width:22px;height:22px;font-size:9px}
.gimg .lk{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 9px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.gimg .lk .ico{width:13px;height:13px}
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(8,9,12,.94);display:grid;grid-template-columns:minmax(0,1fr) 340px;color:#fff}
.lightbox .pic{position:relative;display:grid;place-items:center;padding:64px 80px;min-width:0;min-height:0}
.lightbox .pic .ph{display:block;aspect-ratio:var(--ar,1);width:100%;max-width:min(100%,calc((100vh - 128px) * var(--ar,1)));border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.lightbox .nav:hover{background:rgba(255,255,255,.22)}
.lightbox .nav.prev{left:18px}.lightbox .nav.next{right:18px}
.lightbox .close{position:absolute;top:14px;left:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.lightbox .idx{position:absolute;top:24px;right:20px;font-size:13px;opacity:.7;font-variant-numeric:tabular-nums}
.lightbox .side{background:var(--surface);color:var(--text);display:flex;flex-direction:column;min-height:0}
.lightbox .side .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.lightbox .side .hd .who{flex:1;min-width:0}
.lightbox .side .hd .who b{display:block;font-weight:600;font-size:14px}
.lightbox .side .hd .who span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lightbox .side .cap{padding:14px 16px 10px;font-size:14px;color:var(--text-2)}
.lightbox .side .acts{display:flex;gap:2px;padding:0 10px 8px;border-bottom:1px solid var(--border)}
.lightbox .side .cms{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.lightbox .side .cm-input{padding:10px 12px;border-top:1px solid var(--border)}

/* ---------- Lesson player ---------- */
.lesson-wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.curric{position:sticky;top:0;max-height:calc(100vh - var(--topbar-h) - 48px);overflow-y:auto;display:flex;flex-direction:column}
.curric .top{padding:14px 16px;border-bottom:1px solid var(--border)}
.curric .top h2{font-size:15px}
.csec{padding:8px 8px 4px}
.csec h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 8px 4px;font-weight:600}
.lsn{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:8px;text-align:left;font-size:13.5px;color:var(--text-2);font-weight:500}
.lsn:hover{background:var(--hover);color:var(--text)}
.lsn[aria-current="true"]{background:var(--active);color:var(--brand-ink);font-weight:600}
.lsn .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex:none;color:#fff}
.lsn[data-done="true"] .ck{background:var(--success);border-color:var(--success)}
.lsn .ck .ico{width:12px;height:12px}
.lsn[data-locked="true"]{color:var(--faint);cursor:not-allowed}
.lsn[data-locked="true"] .ck{border-style:dashed;color:var(--faint)}
.lsn .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsn .dur{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.lesson{display:flex;flex-direction:column;gap:16px;min-width:0}
.vid{aspect-ratio:16/9;max-width:100%;border-radius:12px;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}
.vid .play{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;backdrop-filter:blur(6px)}
.vid .play:hover{background:rgba(255,255,255,.32)}
.vid .play .ico{width:30px;height:30px;fill:#fff;stroke:none;margin-left:4px}
.vid .dur{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:5px;font-size:12px;font-variant-numeric:tabular-nums}
.vid .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}
.vid .bar i{display:block;height:100%;width:var(--w,0%);background:#fff}
.lesson-h{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.lesson-h > div:first-child{min-width:0;flex:1 1 280px}
.lesson-h .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.lesson-h h1{font-size:22px;line-height:1.3;margin-top:4px}
.lesson-h .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rich{color:var(--text-2);font-size:15px;line-height:1.65;max-width:68ch;display:flex;flex-direction:column;gap:12px}
.rich h3{color:var(--text);font-size:17px;margin-top:6px}
.rich ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.rich .callout{border-left:3px solid var(--brand);background:var(--brand-soft);padding:10px 14px;border-radius:0 10px 10px 0;color:var(--text)}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lesson-nav .btn{max-width:100%;min-width:0}
.lesson-nav .btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lesson-nav .btn[disabled]{opacity:.55;cursor:not-allowed}

/* ---------- Events calendar ---------- */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.cal-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.cal-h h2{font-size:16px;flex:1;font-variant-numeric:tabular-nums}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:8px;gap:2px}
.cal-grid .wd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:center;padding:6px 0}
.cal-day{min-height:92px;border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;align-items:stretch;border:1px solid transparent;min-width:0}
.cal-day:hover{background:var(--hover)}
.cal-day.out{opacity:.4}
.cal-day .n{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;color:var(--text-2)}
.cal-day.today .n{background:var(--brand);color:var(--brand-text)}
.cal-day[aria-selected="true"]{border-color:var(--brand);background:var(--brand-soft)}
.cal-ev{font-size:11.5px;font-weight:500;padding:2px 6px;border-radius:5px;background:var(--brand-soft);color:var(--brand-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;min-width:0}
.cal-ev.live{background:var(--danger);color:#fff}
.cal-ev .live-dot{width:6px;height:6px;animation:none;background:#fff}
.cal-dots{display:none;gap:3px;padding-left:4px}
.cal-dots i{width:6px;height:6px;border-radius:50%;background:var(--brand)}
.ev-detail{display:flex;flex-direction:column;gap:12px;padding:16px}
.ev-detail h2{font-size:18px;line-height:1.3}
.ev-detail .meta{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--text-2)}
.ev-detail .meta div{display:flex;align-items:center;gap:8px}
.ev-detail .meta .ico{width:16px;height:16px;color:var(--muted);flex:none}
.ev-detail .btns{display:flex;gap:8px;flex-wrap:wrap}
.ev-detail .att{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ev-detail p.d{color:var(--text-2);font-size:14px}
.live-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--danger);text-transform:uppercase;letter-spacing:.04em}
.event-card .info h3 button{font:inherit;text-align:left}
.event-card .info h3 button:hover{color:var(--brand-ink)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .page-inner{grid-template-columns:minmax(0,1fr);max-width:760px}
  .page-inner.wide{max-width:none}
  .rail{display:none}
  .stream-wrap,.cal-wrap,.lesson-wrap{grid-template-columns:minmax(0,1fr)}
  .curric{position:static;max-height:none}
  .schat{position:static;height:420px}
}
@media (max-width:900px){
  .lightbox{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .lightbox .pic{padding:64px 16px 16px}
  .lightbox .side{max-height:42vh}
  .lightbox .side .cms{display:none}
}
@media (max-width:800px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);z-index:85;transform:translateX(-100%);transition:transform .25s;box-shadow:none;padding-top:env(safe-area-inset-top,0px)}
  .sidebar.show{transform:none;box-shadow:var(--shadow-lg)}
  .hamb{display:grid}
  .topbar{padding:0 12px;gap:6px}
  .search{width:38px;padding:0;justify-content:center}
  .search input,.search kbd{display:none}
  .btn.primary .lbl{display:none}
  .btn.primary{padding:0 10px}
  .crumb{font-size:15px}
  .crumb .sub{display:none}
  .page-inner{padding:16px 16px 40px}
  .space-body{padding:0 16px}
  .space-actions .btn.ghost{display:none}
  .post{padding:14px 16px 10px}
  .event-card{flex-wrap:wrap}
  .event-card .rs{width:100%;flex-direction:row;justify-content:flex-start}
  .dm{right:16px}
  .theme-btn{display:none}
  .live-now{padding:0 9px;gap:0}
  .live-now .l{display:none}
  .room{min-height:0}
  .room-h{padding:8px 10px;gap:8px}
  .room-h .meta span:nth-child(3){display:none}
  .room-h .r .sbtn:not([data-room]){display:none}
  .stage{padding:10px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(120px,1fr)}
  .tile .nm{font-size:11px;height:22px}
  .pip{width:104px}
  .crumb .type-badge{display:none}
  .tile.share .doc{width:72%;margin-top:30px}
  .pip .av{width:32px;height:32px;font-size:11px}
  .room-panel{position:absolute;right:0;top:0;bottom:0;width:min(340px,92%);z-index:5;box-shadow:var(--shadow-lg)}
  .room-ctl{gap:2px;padding:10px 6px}
  .ctl{width:42px;padding:4px 0}
  .ctl .k{width:36px;height:36px}
  .ctl .l{display:none}
  .ctl.leave .k{padding:0 12px}
  .react-tray{bottom:70px}
  .prejoin{grid-template-columns:1fr;padding:14px}
  .compact-h{padding:10px 14px}
  .compact-h .desc{display:none}
  .thread-panel{position:absolute;right:0;top:0;bottom:0;width:min(360px,92%);z-index:5;box-shadow:var(--shadow-lg)}

  let extra = '';
  if(p.type==='image') extra = `<div class="media" style="background:${p.media}" role="img" aria-label="Screenshot placeholder"><span class="cap">${esc(p.cap)}</span></div>`;
  if(p.type==='poll'){
    const v = state.votes[p.id]; const total = p.poll.votes + (v!==undefined?1:0);
    extra = `<div class="poll" role="radiogroup" aria-label="Poll">${p.poll.opts.map(([o,c],i)=>{ const n=c+(v===i?1:0); const pct=Math.round(n/total*100);
      return `<button class="opt" role="radio" aria-checked="${v===i}" data-vote="${i}" data-post="${p.id}" style="--w:${v!==undefined?pct:0}%"><span class="bar" aria-hidden="true"></span><span>${esc(o)}</span><span class="pct">${v!==undefined?pct+'%':''}</span></button>`;}).join('')}
      <div class="poll-meta">${fmt(total)} votes · ${v!==undefined?'You voted. Click again to change.':'Vote to see results · closes in 2 days'}</div></div>`;
  }
  if(p.type==='event'){ const e = events.find(x=>x.id===p.event); const on = state.rsvp.has(e.id);
    extra = `<div class="ev">${dateChip(e.d)}<div class="ev-meta"><b>${esc(e.t)}</b><span>${weekday(e.d)} · ${e.time} · ${e.loc}</span><span>${fmt(e.going+(on?1:0))} going</span></div><button class="btn ${on?'on':'primary'} sm" data-rsvp="${e.id}">${on?ico('check','ico sm')+'Going':'RSVP'}</button></div>`; }
  if(p.type==='course'){ const c = courses.find(x=>x.id===p.course); const pct = Math.round(c.done/c.lessons*100);
    extra = `<div class="course-inline"><div class="course-thumb" style="background:${c.cover}" aria-hidden="true"></div><div style="flex:1;min-width:0"><b>${esc(c.t)}</b><div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="--w:${pct}%"></i></div><div class="prog-lbl"><span>${c.done} of ${c.lessons} lessons</span><span>${pct}%</span></div></div><button class="btn ghost sm" data-lesson="${c.id}">Continue</button></div>`; }
  const comments = p.cm ? `<div class="comments">${p.cm.map(c=>`<div class="cm">${av(c.a,'sm')}<div class="bubble"><div class="hd"><b>${esc(c.a)}</b><span>${c.ago}</span></div><p>${esc(c.t)}</p><div class="cm-acts"><button data-action="toast" data-msg="Liked comment">Like · ${c.likes}</button><button data-action="toast" data-msg="Reply box (mock)">Reply</button></div>

function feedPosts(){
  let list = posts.filter(p=> state.view!=='space' || p.space===state.space);
  if(state.filter==='popular') list = list.filter(p=>p.likes>=40);
  if(state.filter==='pinned') list = list.filter(p=>p.pinned);
  if(state.sort==='liked') list = [...list].sort((a,b)=>b.likes-a.likes);
  if(state.sort==='oldest') list = [...list].reverse();
  if(state.sort==='latest') list = [...list.filter(p=>p.pinned), ...list.filter(p=>!p.pinned)];
  return list;
}

function burst(emoji){
  const stage=$('#stage'); if(!stage) return;
  for(let i=0;i<6;i++){ const b=document.createElement('span'); b.className='burst'; b.textContent=emoji; b.style.left=(42+Math.random()*16)+'%'; b.style.setProperty('--dx',(Math.random()*120-60)+'px'); b.style.animationDelay=(i*.12)+'s'; stage.appendChild(b); setTimeout(()=>b.remove(),2000); }
  roomChat.push({sys:true,t:`You reacted ${emoji}`}); const l=$('#roomChatList'); if(l){ l.insertAdjacentHTML('beforeend',pmsg(roomChat[roomChat.length-1])); l.scrollTop=l.scrollHeight; }
}
function roomAction(k,t){
  const nameEl=$('#joinName'); if(nameEl) room.name=nameEl.value.trim()||ME;
  if(k==='join'||k==='join-audio'){ if(k==='join-audio') room.cam=false; room.joined=true; room.started=Date.now()-754000; room.panelOpen=innerWidth>800; room.panel='chat'; renderMain(); toast('You joined the room'); return; }
  if(k==='leave'){ room.joined=false; room.hand=false; room.share=false; room.tray=false; renderMain(); toast('You left the room'); return; }
  if(k==='mic'){ room.mic=!room.mic; renderMain(); return; }
  if(k==='cam'){ room.cam=!room.cam; renderMain(); return; }
  if(k==='share'){ room.share=!room.share; renderMain(); toast(room.share?'You are sharing your screen':'Stopped sharing'); return; }
  if(k==='hand'){ room.hand=!room.hand; renderMain(); toast(room.hand?'Hand raised':'Hand lowered'); return; }

function calendarView(list){
  const {y,m}=state.cal; const first=new Date(y,m,1).getDay(); const days=new Date(y,m+1,0).getDate(); const prevDays=new Date(y,m,0).getDate();
  const td=new Date(); const todayKey=`${td.getFullYear()}-${pad2(td.getMonth()+1)}-${pad2(td.getDate())}`;
  const cells=[]; const rows = Math.ceil((first+days)/7);
  for(let i=0;i<rows*7;i++){ const dn=i-first+1; let key, out=false, num;
    if(dn<1){ num=prevDays+dn; out=true; const pm=m===0?11:m-1, py=m===0?y-1:y; key=`${py}-${pad2(pm+1)}-${pad2(num)}`; }
    else if(dn>days){ num=dn-days; out=true; const nm=m===11?0:m+1, ny=m===11?y+1:y; key=`${ny}-${pad2(nm+1)}-${pad2(num)}`; }
    else { num=dn; key=`${y}-${pad2(m+1)}-${pad2(num)}`; }
    const evs=list.filter(e=>e.d===key);
    cells.push(`<button class="cal-day ${out?'out':''} ${key===todayKey?'today':''}" data-calday="${key}" aria-selected="${state.calDay===key}" aria-label="${MONTHS_LONG[+key.split('-')[1]-1]} ${num}${evs.length?', '+evs.length+(evs.length===1?' event':' events'):''}"><span class="n">${num}</span>${evs.map(e=>`<span class="cal-ev ${e.live?'live':''}">${e.live?'<i class="live-dot"></i>':''}${esc(e.t)}</span>`).join('')}<span class="cal-dots" aria-hidden="true">${evs.map(()=>'<i></i>').join('')}</span></button>`); }
  const sel = events.find(e=>e.id===state.evSel) || list.find(e=>e.d.startsWith(`${y}-${pad2(m+1)}`)) || list[0];
  const dayEvs = state.calDay ? list.filter(e=>e.d===state.calDay) : [];
  const detail = sel ? eventDetail(sel,false) : `<div class="card empty"><div class="big">📅</div>No events this month.</div>`;
  const dayList = state.calDay && !dayEvs.length ? `<div class="card empty" style="padding:20px">Nothing scheduled on ${MONTHS_LONG[+state.calDay.split('-')[1]-1]} ${+state.calDay.split('-')[2]}.<br><button class="btn soft sm" style="margin-top:10px" data-action="toast" data-msg="New event (admin)">Add an event</button></div>` : '';
  return `<div class="cal-wrap"><section class="card"><div class="cal-h"><h2>${MONTHS_LONG[m]} ${y}</h2><button class="icon-btn" data-cal="-1" aria-label="Previous month">${ico('chevL')}</button><button class="btn soft sm" data-cal="0">Today</button><button class="icon-btn" data-cal="1" aria-label="Next month">${ico('chevR')}</button></div>
    <div class="cal-grid" role="grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="wd">${d}</div>`).join('')}${cells.join('')}</div></section>
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0">${dayList}${detail}</div></div>`;
}

function mountLive(){
  if($('#roomTimer')){
    const tick=()=>{ const el=$('#roomTimer'); if(!el) return; const sec=Math.max(0,Math.floor((Date.now()-room.started)/1000)); el.textContent=cdFmt(sec); }; tick(); every(1000,tick);
    every(3200,()=>{ const tiles=$$('#tiles .tile[data-idx]'); const talkers=tiles.filter(t=>t.dataset.mic==='true'); if(!talkers.length) return; room.speaking=(room.speaking+1)%talkers.length; tiles.forEach(t=>t.dataset.speaking='false'); talkers[room.speaking].dataset.speaking='true'; room.speaking=+talkers[room.speaking].dataset.idx; });
    const rl=$('#roomChatList'); if(rl) rl.scrollTop=rl.scrollHeight;
  }
  if($('#schatList')){
    const l=$('#schatList'); l.scrollTop=l.scrollHeight;
    every(3500,()=>{ const l=$('#schatList'); if(!l) return; const m=stream.pool[stream.i++%stream.pool.length]; stream.chat.push(m); l.insertAdjacentHTML('beforeend',smsg(m)); if(stream.chat.length>40){ stream.chat.shift(); l.firstElementChild.remove(); } l.scrollTop=l.scrollHeight; });
    every(2000,()=>{ const v=$('#streamViewers'); if(!v) return; stream.viewers=Math.max(300,stream.viewers+Math.round((Math.random()-.42)*9)); v.textContent=fmt(stream.viewers); });
    if($('#countdown')) every(1000,()=>{ stream.cd=Math.max(0,stream.cd-1); const el=$('#countdown'); if(el) el.textContent=cdFmt(stream.cd); });
  }
  if($('#chatList')){
    const l=$('#chatList'); l.scrollTop=l.scrollHeight; const tl=$('#threadList'); if(tl) tl.scrollTop=tl.scrollHeight;
    every(4500,()=>{ const t=$('#chatTyping'); if(!t) return; t.hidden=false; setTimeout(()=>{ t.hidden=true; },2400); });
  }
}

/* ---------------- Events (delegated) ---------------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-menu],[data-action],[data-view],[data-space],[data-group],[data-tab],[data-sort],[data-filter],[data-like],[data-save],[data-react],[data-vote],[data-rsvp],[data-follow],[data-dm],[data-mfilter],[data-nfilter],[data-notif],[data-thread],[data-room],[data-panel],[data-qa-vote],[data-stream],[data-img],[data-lb],[data-topen],[data-tclose],[data-creact],[data-lesson],[data-lgo],[data-lcomplete],[data-evmode],[data-event],[data-evback],[data-cal],[data-calday]');
  if(!e.target.closest('.menu') && !t?.dataset.menu) closeMenus();
  if(!t) return;
  const d = t.dataset;
  if(d.menu){ const m=$('#'+d.menu); const open=m.hidden; closeMenus(m); m.hidden=!open; t.setAttribute('aria-expanded',String(open)); return; }
  if(d.action){
    const a=d.action;
    if(a==='toast') toast(d.msg||'Done');
    if(a==='close-drawer') openDrawer(false);
    if(a==='close-dm'){ state.dmOpen=false; renderDM(); }
    if(a==='dm-back'){ state.dmThread=null; renderDM(); }
    if(a==='open-profile'){ go('profile'); }
    if(a==='join-live'){ room.joined=true; room.started=Date.now()-754000; room.panelOpen=innerWidth>800; go('space','lounge'); toast('Joined Community Lounge'); }
    if(a==='open-composer'){ const c=$('#composer'); c.dataset.open='true'; $('#composerTitle').focus(); }
    if(a==='close-composer'){ $('#composer').dataset.open='false'; }
    if(a==='publish'){ const title=$('#composerTitle').value.trim(), body=$('#composerBody').value.trim(); if(!title&&!body){ toast('Add a title or some text first'); return; }
      posts.unshift({id:'p'+Date.now(), a:ME, space: state.view==='space'?state.space:'general', ago:'Just now', title: title||body.slice(0,60), body: esc(body), likes:0, comments:0, reacts:[], type:'text'}); renderMain(); toast('Published'); }
    closeMenus(); return;
  }
  if(d.room){ roomAction(d.room,t); return; }
  if(d.panel){ room.panel=d.panel; room.panelOpen=true; renderMain(); return; }
  if(d.qaVote!==undefined){ const i=+d.qaVote; room.qaVotes.has(i)?room.qaVotes.delete(i):room.qaVotes.add(i); renderMain(); return; }
  if(d.stream){ if(d.stream==='notify'){ stream.notify=!stream.notify; toast(stream.notify?'We will notify you when the stream starts':'Notification removed'); } else { stream.mode=d.stream; stream.cd=299; } renderMain(); return; }
  if(d.img!==undefined){ openLightbox(+d.img); return; }
  if(d.lb){ lbAction(d.lb); return; }
  if(d.topen!==undefined){ const m=chatMsgs[+d.topen]; if(!m.replies) m.replies=[]; state.chatThread=+d.topen; renderMain(); const inp=$('#threadInput'); if(inp) inp.focus(); return; }
  if(d.tclose){ state.chatThread=null; renderMain(); return; }
  if(d.creact){ const [i,e]=d.creact.split(':'); const m=chatMsgs[+i]; m.reacts=m.reacts||[]; const r=m.reacts.find(x=>x[0]===e); if(r) r[1]+=1; else m.reacts.push([e,1]); renderMain(); return; }
  if(d.lesson){ openLesson(d.lesson); return; }
  if(d.lgo!==undefined){ if(t.dataset.locked==='true'){ toast('This lesson unlocks after you complete the previous one'); return; } state.lesson.i=+d.lgo; renderMain(); return; }
  if(d.lcomplete){ completeLesson(); return; }
  if(d.evmode){ state.evMode=d.evmode; state.evOpen=null; renderMain(); return; }
  if(d.event){ state.evSel=d.event; if(state.evMode!=='calendar') state.evOpen=d.event; state.calDay=events.find(e=>e.id===d.event).d; renderMain(); return; }
  if(d.evback){ state.evOpen=null; renderMain(); return; }
  if(d.cal){ if(d.cal==='0'){ state.cal={y:2026,m:8}; } else { let m=state.cal.m+ +d.cal, y=state.cal.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} state.cal={y,m}; } state.calDay=null; state.evSel=null; renderMain(); return; }
  if(d.calday){ state.calDay=d.calday; const first=events.find(e=>e.d===d.calday); state.evSel=first?first.id:null; renderMain(); return; }
  if(d.group){ state.groupOpen[d.group] = !(state.groupOpen[d.group]!==false); try{localStorage.setItem('circle-shell-groups',JSON.stringify(state.groupOpen));}catch(err){} renderSidebar(); return; }
  if(d.space){ openPalette(false); go('space', d.space); return; }
  if(d.view){ openPalette(false); go(d.view); return; }
  if(d.tab){ state.tab=d.tab; renderMain(); return; }
  if(d.sort){ state.sort=d.sort; closeMenus(); renderMain(); return; }
  if(d.filter){ state.filter=d.filter; renderMain(); return; }
  if(d.like){ const p=posts.find(x=>x.id===d.like); state.liked.has(p.id)?state.liked.delete(p.id):state.liked.add(p.id); const liked=state.liked.has(p.id); t.setAttribute('aria-pressed',String(liked)); t.querySelector('span').textContent=`${liked?'Liked':'Like'} · ${fmt(p.likes+(liked?1:0))}`; return; }
  if(d.save){ const on=!state.saved.has(d.save); on?state.saved.add(d.save):state.saved.delete(d.save); t.setAttribute('aria-pressed',String(on)); t.setAttribute('aria-label',on?'Remove bookmark':'Bookmark'); toast(on?'Saved to bookmarks':'Removed from bookmarks'); return; }
  if(d.react){ const k='r-'+d.react; state[k]=!state[k]; const [pid,i]=d.react.split(':'); const p=posts.find(x=>x.id===pid); t.setAttribute('aria-pressed',String(state[k])); t.querySelector('span').textContent=p.reacts[+i][1]+(state[k]?1:0); return; }
  if(d.vote){ const cur=state.votes[d.post]; state.votes[d.post] = (cur===+d.vote) ? undefined : +d.vote; if(state.votes[d.post]===undefined) delete state.votes[d.post]; const card=t.closest('.post'); card.outerHTML = postCard(posts.find(p=>p.id===d.post)); return; }
  if(d.rsvp){ state.rsvp.has(d.rsvp)?state.rsvp.delete(d.rsvp):state.rsvp.add(d.rsvp); toast(state.rsvp.has(d.rsvp)?'You are going':'RSVP removed'); renderMain(); return; }
  if(d.follow){ state.follow.has(d.follow)?state.follow.delete(d.follow):state.follow.add(d.follow); renderMain(); return; }
  if(d.dm){ openPalette(false); const c = convos.find(x=>x.a===d.dm) || (convos.push({id:'d'+Date.now(), a:d.dm, ago:'Now', unread:false, msgs:[]}), convos[convos.length-1]); state.dmOpen=true; state.dmThread=c.id; c.unread=false; renderDM(); return; }
  if(d.mfilter){ state.mfilter=d.mfilter; renderMain(); return; }
  if(d.nfilter){ state.nfilter=d.nfilter; $$('[data-nfilter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.nfilter===d.nfilter))); renderNotifs(); return; }
  if(d.notif){ const n=notifications.find(x=>x.id===+d.notif); n.unread=false; renderNotifs(); toast('Opening notification'); return; }
  if(d.thread){ state.dmThread=d.thread; convos.find(c=>c.id===d.thread).unread=false; renderDM(); return; }
});

document.addEventListener('input', e=>{
  if(e.target.id==='mq'){ state.mq=e.target.value; const grid=$('.grid'); const tmp=document.createElement('div'); tmp.innerHTML=membersView(); grid.replaceWith(tmp.querySelector('.grid')); $('.filterbar .count').textContent = tmp.querySelector('.filterbar .count').textContent; }
  if(e.target.id==='palInput') renderPalette();
});
document.addEventListener('submit', e=>{
  const val = id => { const i=$('#'+id); const v=i?i.value.trim():''; if(i) i.value=''; return v; };
  if(e.target.id==='roomChatForm'){ e.preventDefault(); const v=val('roomChatInput'); if(!v) return; roomChat.push({a:room.name,t:v,at:nowTime()}); const l=$('#roomChatList'); l.insertAdjacentHTML('beforeend',pmsg(roomChat[roomChat.length-1])); l.scrollTop=l.scrollHeight; return; }
  if(e.target.id==='qaForm'){ e.preventDefault(); const v=val('qaInput'); if(!v) return; qaList.push({q:v,a:room.name,v:0}); renderMain(); toast('Question submitted'); return; }
  if(e.target.id==='streamChatForm'){ e.preventDefault(); const v=val('streamChatInput'); if(!v) return; const m={a:ME,t:v,me:true}; stream.chat.push(m); const l=$('#schatList'); l.insertAdjacentHTML('beforeend',smsg(m)); l.scrollTop=l.scrollHeight; return; }
  if(e.target.id==='chatForm'){ e.preventDefault(); const v=val('chatInput'); if(!v) return; chatMsgs.push({day:'Today',a:ME,at:nowTime(),t:v}); renderMain(); $('#chatInput').focus();
    setTimeout(()=>{ if(state.view==='space'&&state.space==='water'&&state.tab==='chat'){ chatMsgs.push({day:'Today',a:'Hana Sato',at:nowTime(),t:['Ha, agreed.','Wait, say more?','Adding that to the office hours doc.'][chatMsgs.length%3]}); const focused=document.activeElement&&document.activeElement.id; renderMain(); if(focused==='chatInput') $('#chatInput').focus(); } },2600); return; }
  if(e.target.id==='threadForm'){ e.preventDefault(); const v=val('threadInput'); if(!v) return; chatMsgs[state.chatThread].replies.push({a:ME,at:nowTime(),t:v}); renderMain(); $('#threadInput').focus(); return; }
  if(e.target.id==='dmForm'){ e.preventDefault(); const inp=$('#dmInput'); const v=inp.value.trim(); if(!v) return; const c=convos.find(x=>x.id===state.dmThread); c.msgs.push({me:true,t:v,at:'Now'}); c.ago='Now'; inp.value=''; renderDM();
    setTimeout(()=>{ if(state.dmThread===c.id){ c.msgs.push({me:false,t:['On it 👍','Sounds good, thanks!','Let me check and get back to you.'][c.msgs.length%3],at:'Now'}); renderDM(); } },1400); }
});
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette($('#palette').hidden); return; }
  if(e.key==='Escape'){ openPalette(false); openDrawer(false); closeMenus(); closeSidebar(); if(state.lb!=null){ closeLightbox(); return; } if(room.tray){ room.tray=false; renderMain(); } if(state.dmOpen){state.dmOpen=false; renderDM();} return; }
  if(state.lb!=null && !$('#lightbox').hidden){ if(e.key==='ArrowRight'){ lbAction('next'); return; } if(e.key==='ArrowLeft'){ lbAction('prev'); return; } }
  if(!$('#palette').hidden){
    if(e.key==='ArrowDown'){ e.preventDefault(); palMove(1); }
    if(e.key==='ArrowUp'){ e.preventDefault(); palMove(-1); }
    if(e.key==='Enter'){ e.preventDefault(); const sel=$('#palList .pal-item[aria-selected="true"]'); if(sel) sel.click(); }
  }
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.comment){ const v=e.target.value.trim(); if(!v) return; const p=posts.find(x=>x.id===e.target.dataset.comment); p.cm.push({a:ME, ago:'Just now', t:v, likes:0}); p.comments++; renderMain(); toast('Comment posted'); }
});
$('#searchBtn').addEventListener('click', ()=>openPalette(true));
$('#lightbox').addEventListener('click', e=>{ if(e.target.classList.contains('pic')) closeLightbox(); });
$('#palette').addEventListener('click', e=>{ if(e.target===e.currentTarget) openPalette(false); });
$('#bellBtn').addEventListener('click', ()=>openDrawer(!$('#drawer').classList.contains('show')));
$('#scrim').addEventListener('click', ()=>{ openDrawer(false); closeSidebar(); });
$('#markAll').addEventListener('click', ()=>{ notifications.forEach(n=>n.unread=false); renderNotifs(); toast('All notifications marked as read'); });
$('#dmBtn').addEventListener('click', ()=>{ state.dmOpen=!state.dmOpen; renderDM(); });
$('#newPostBtn').addEventListener('click', ()=>{ if(!['feed','space'].includes(state.view) || (state.view==='space' && !tabsFor(spaceBy(state.space)).some(([k])=>k==='posts'))) go('feed'); state.tab='posts'; renderMain(); const c=$('#composer'); c.dataset.open='true'; c.scrollIntoView({block:'center'}); $('#composerTitle').focus(); });
$('#hambBtn').addEventListener('click', ()=>{ const open=!$('#sidebar').classList.contains('show'); $('#sidebar').classList.toggle('show',open); $('#hambBtn').setAttribute('aria-expanded',String(open)); $('#scrim').classList.toggle('show',open); });

/* ---------------- Boot ---------------- */
renderSidebar(); renderMain(); renderNotifs(); renderDM();
})();
</script>
