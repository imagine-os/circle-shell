<title>Maker Circle</title>
<meta name="description" content="Circle shell rebuild: a static front-end recreation of the Circle community app shell with mock data.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --brand:#506CF0; --brand-ink:#3E57D6; --brand-soft:#EEF1FE; --brand-text:#FFFFFF;
  --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#F3F4F6; --hover:#F1F2F5; --active:#E9ECF8;
  --border:#E6E8EC; --border-strong:#D5D8DF;
  --text:#191B1F; --text-2:#4B5563; --muted:#6B7280; --faint:#9CA3AF;
  --danger:#E5484D; --success:#2FA36B; --warn:#E0A100;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.08);
  --sidebar-bg:#FFFFFF; --sidebar-w:280px; --rail-w:300px; --main-w:680px; --topbar-h:64px;
  --radius:12px; --radius-sm:8px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --cover:linear-gradient(120deg,#506CF0 0%,#8B5CF6 55%,#EC4899 100%);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand:#7B8FF5; --brand-ink:#98A8F8; --brand-soft:#262B45; --brand-text:#0F1120;
    --bg:#191B1F; --surface:#22252B; --surface-2:#2A2D34; --hover:#2C2F37; --active:#2E3350;
    --border:#33363D; --border-strong:#44474F;
    --text:#F3F4F6; --text-2:#C9CDD4; --muted:#9CA3AF; --faint:#6B7280;
    --danger:#F0616A; --success:#4CC38A; --warn:#F2B93B;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
    --sidebar-bg:#1E2025;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#7B8FF5; --brand-ink:#98A8F8; --brand-soft:#262B45; --brand-text:#0F1120;
  --bg:#191B1F; --surface:#22252B; --surface-2:#2A2D34; --hover:#2C2F37; --active:#2E3350;
  --border:#33363D; --border-strong:#44474F;
  --text:#F3F4F6; --text-2:#C9CDD4; --muted:#9CA3AF; --faint:#6B7280;
  --danger:#F0616A; --success:#4CC38A; --warn:#F2B93B;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  --sidebar-bg:#1E2025;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ---------- App frame ---------- */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100%;min-height:100%}
.sidebar{background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;position:sticky;top:0;overflow:hidden}
.side-scroll{flex:1;overflow-y:auto;padding:8px 12px 12px}
.content{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.page{flex:1;overflow-y:auto;overflow-x:hidden}
.page-inner{max-width:calc(var(--main-w) + var(--rail-w) + 24px);margin:0 auto;padding:24px 16px 40px;display:grid;grid-template-columns:minmax(0,var(--main-w)) var(--rail-w);gap:24px;align-items:start}
.page-inner.wide{grid-template-columns:minmax(0,1fr)}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.rail{position:sticky;top:0;display:flex;flex-direction:column;gap:16px}

/* ---------- Sidebar ---------- */
.community{display:flex;align-items:center;gap:10px;width:100%;padding:14px 12px;height:var(--topbar-h);border-bottom:1px solid var(--border);text-align:left}
.community:hover{background:var(--hover)}
.logo{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--brand-text);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.community .name{font-weight:600;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.community .ico{color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:var(--radius-sm);color:var(--text-2);font-weight:500;text-align:left;position:relative;line-height:1.3}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--active);color:var(--brand-ink)}
:root[data-theme="dark"] .nav-item[aria-current="page"]{color:#C7D0FF}
.nav-item .ico{color:inherit;opacity:.85}
.nav-item .emoji{width:20px;text-align:center;font-size:15px;flex:none}
.nav-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.group{margin-top:14px}
.group-h{display:flex;align-items:center;gap:6px;width:100%;padding:6px 10px 6px 8px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-radius:var(--radius-sm)}
.group-h:hover{color:var(--text);background:var(--hover)}
.group-h .ico{transition:transform .18s}
.group[data-open="false"] .group-h .ico{transform:rotate(-90deg)}
.group[data-open="false"] .group-list{display:none}
.group-list{display:flex;flex-direction:column;gap:1px}
.side-foot{border-top:1px solid var(--border);padding:10px 12px}
.me-row{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:var(--radius-sm);text-align:left}
.me-row:hover{background:var(--hover)}
.me-row .who{flex:1;min-width:0}
.me-row .who b{display:block;font-weight:600;font-size:13px}
.me-row .who span{font-size:12px;color:var(--muted)}
.powered{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:var(--faint);padding:8px 0 2px}
.powered i{width:12px;height:12px;border-radius:50%;border:2.5px solid currentColor;display:inline-block}

/* ---------- Avatars ---------- */
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none;letter-spacing:.01em;user-select:none}
.av.xs{width:24px;height:24px;font-size:10px}
.av.sm{width:28px;height:28px;font-size:11px}
.av.lg{width:48px;height:48px;font-size:17px}
.av.xl{width:64px;height:64px;font-size:22px}
.stack{display:flex}
.stack .av{border:2px solid var(--surface);margin-left:-6px}
.stack .av:first-child{margin-left:0}

/* ---------- Top bar ---------- */
.topbar{height:var(--topbar-h);border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 20px;flex:none}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:16px}
.crumb .sub{font-weight:400;color:var(--muted);font-size:14px}
.crumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:0 10px;height:38px;width:280px;color:var(--muted)}
.search:hover{border-color:var(--border-strong)}
.search:focus-within{border-color:var(--brand);background:var(--surface)}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;color:var(--text)}
.search input::placeholder{color:var(--muted)}
kbd{font:inherit;font-size:11px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface)}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);position:relative}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn[aria-expanded="true"]{background:var(--active);color:var(--brand-ink)}
.badge{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface);line-height:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;font-weight:600;font-size:13.5px;border:1px solid transparent;white-space:nowrap}
.btn.primary{background:var(--brand);color:var(--brand-text)}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{border-color:var(--border-strong);background:var(--surface);color:var(--text)}
.btn.ghost:hover{background:var(--hover)}
.btn.soft{background:var(--surface-2);color:var(--text)}
.btn.soft:hover{background:var(--hover)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.on{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
.btn .ico{width:16px;height:16px}
.hamb{display:none}

/* ---------- Dropdowns ---------- */
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:6px;z-index:60}
.menu.left{left:0;right:auto}
.menu button,.menu a{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;font-weight:500;color:var(--text-2)}
.menu button:hover,.menu a:hover{background:var(--hover);color:var(--text)}
.menu button .ico{width:17px;height:17px;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
.menu .hd{padding:6px 10px 4px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.menu button.danger{color:var(--danger)}
.menu button .check{margin-left:auto;color:var(--brand)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.card-h .more{flex:none}
.card-h h3{font-size:14px}
.card-h .more{font-size:12.5px;color:var(--brand-ink);font-weight:500}
.card-b{padding:12px 16px 16px}

/* Space header */
.space-head{overflow:hidden}
.cover{height:96px;background:var(--cover)}
.space-body{padding:0 20px 0;position:relative}
.space-row{display:flex;align-items:flex-start;gap:14px}
.space-emoji{margin-top:-28px;width:64px;height:64px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);display:grid;place-items:center;font-size:30px}
.space-meta{flex:1;min-width:0;padding-top:10px}
.space-meta h1{font-size:20px;line-height:1.25}
.space-meta p{color:var(--muted);font-size:13.5px;margin-top:2px}
.space-actions{display:flex;align-items:center;gap:10px;padding-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);font-weight:600;font-size:12.5px}
.tabs{display:flex;gap:4px;margin-top:12px;border-top:1px solid var(--border);padding-top:4px}
.tab{padding:10px 12px;font-weight:500;color:var(--muted);position:relative;border-radius:8px 8px 0 0}
.tab:hover{color:var(--text);background:var(--hover)}
.tab[aria-selected="true"]{color:var(--text);font-weight:600}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--brand);border-radius:2px}
.member-note{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:8px}

/* Composer */
.composer{padding:12px 16px}
.composer-row{display:flex;align-items:center;gap:12px}
.composer-input{flex:1;height:44px;border-radius:10px;background:var(--surface-2);color:var(--muted);text-align:left;padding:0 14px;font-size:14.5px;border:1px solid transparent}
.composer-input:hover{border-color:var(--border-strong)}
.composer textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;outline:none}
.composer textarea:focus{border-color:var(--brand)}
.composer-tools{display:flex;align-items:center;gap:4px;margin-top:10px}
.tool{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.tool:hover{background:var(--hover);color:var(--text)}
.composer-open{display:none}
.composer[data-open="true"] .composer-row{display:none}
.composer[data-open="true"] .composer-open{display:block}
.composer-foot{display:flex;align-items:center;gap:8px;margin-top:10px}
.composer-foot .btn{margin-left:auto}
.composer-foot .btn + .btn{margin-left:0}

/* Sort row */
.sort-row{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-weight:500;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.sort-row .count{margin-left:auto}

/* Post card */
.post{padding:16px 20px 12px;display:flex;flex-direction:column;gap:12px}
.post.pinned{border-color:var(--brand);border-width:1px}
.post-top{display:flex;align-items:flex-start;gap:12px}
.post-who{flex:1;min-width:0}
.post-who .n{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.post-who .n .role{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--brand-soft);color:var(--brand-ink)}
.post-who .m{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.post-who .m .sp{color:var(--brand-ink);font-weight:500}
.pin-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--brand-ink);font-weight:600}
.post h2{font-size:17px;line-height:1.35;letter-spacing:-.005em}
.post .body{color:var(--text-2);font-size:14.5px;white-space:pre-line}
.post .body b{color:var(--text)}
.media{border-radius:10px;aspect-ratio:16/8;max-width:100%;position:relative;overflow:hidden;background:var(--surface-2)}
.media .cap{position:absolute;left:12px;bottom:10px;font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:6px}
.reacts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.react{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}
.react[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.react:hover{border-color:var(--border-strong)}
.actions{display:flex;align-items:center;gap:2px;border-top:1px solid var(--border);padding-top:8px;margin-top:-2px}
.act{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:8px;color:var(--muted);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.act:hover{background:var(--hover);color:var(--text)}
.act[aria-pressed="true"]{color:var(--brand-ink)}
.act[aria-pressed="true"] .ico{fill:currentColor}
.act.right{margin-left:auto}
.act.icon-only{width:34px;padding:0;justify-content:center}

/* Poll */
.poll{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:10px;overflow:hidden;text-align:left;font-weight:500}
.opt .bar{position:absolute;inset:0;width:var(--w,0%);background:var(--brand-soft);transition:width .35s}
.opt span{position:relative;z-index:1}
.opt .pct{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.opt[aria-checked="true"]{border-color:var(--brand)}
.opt[aria-checked="true"] .pct{color:var(--brand-ink);font-weight:600}
.opt:hover{border-color:var(--border-strong)}
.poll-meta{font-size:12.5px;color:var(--muted)}

/* Event block */
.ev{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.date-chip{width:52px;height:56px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.date-chip b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.date-chip span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--danger);font-weight:700;margin-bottom:3px}
.ev-meta{flex:1;min-width:0}
.ev-meta b{display:block;font-weight:600}
.ev-meta span{font-size:12.5px;color:var(--muted);display:block}

/* Course progress block */
.course-inline{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:10px}
.course-thumb{width:72px;height:56px;border-radius:8px;flex:none;background:linear-gradient(135deg,#F59E0B,#EF4444)}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:var(--w,0%);background:var(--brand);border-radius:3px}
.prog-lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-top:5px;font-variant-numeric:tabular-nums}

/* Comments */
.comments{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border);padding-top:12px}
.cm{display:flex;gap:10px}
.cm .bubble{flex:1;min-width:0}
.cm .bubble .hd{display:flex;align-items:baseline;gap:8px;font-size:13px}
.cm .bubble .hd b{font-weight:600}
.cm .bubble .hd span{color:var(--muted);font-size:12px}
.cm .bubble p{color:var(--text-2);font-size:13.5px;margin-top:2px}
.cm .bubble .cm-acts{display:flex;gap:12px;margin-top:4px;font-size:12px;color:var(--muted);font-weight:500}
.cm .bubble .cm-acts button:hover{color:var(--text)}
.cm .nested{margin-top:10px;display:flex;gap:10px}
.cm-input{display:flex;gap:10px;align-items:center}
.cm-input input{flex:1;height:36px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);padding:0 14px;outline:none}
.cm-input input:focus{border-color:var(--brand);background:var(--surface)}
.view-all{font-size:13px;color:var(--brand-ink);font-weight:500;align-self:flex-start}

/* Right rail widgets */
.about-meta{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:13px;color:var(--text-2)}
.about-meta div{display:flex;align-items:center;gap:8px}
.about-meta .ico{width:16px;height:16px;color:var(--muted)}
.rail-ev{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.rail-ev:first-of-type{border-top:0;padding-top:4px}
.rail-ev .date-chip{width:46px;height:50px}
.rail-ev .date-chip b{font-size:17px}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0}
.lb + .lb{border-top:1px solid var(--border)}
.rank{width:20px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;font-weight:600}
.rank.top{color:var(--warn)}
.lb .who{flex:1;min-width:0}
.lb .who b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .who span{font-size:12px;color:var(--muted)}
.pts{font-size:12.5px;font-weight:600;color:var(--brand-ink);font-variant-numeric:tabular-nums;background:var(--brand-soft);padding:2px 8px;border-radius:999px}
.trend{display:flex;gap:10px;padding:8px 0;align-items:flex-start;width:100%;text-align:left;border-radius:8px}
.trend + .trend{border-top:1px solid var(--border)}
.trend .n{width:22px;font-size:12px;font-weight:700;color:var(--faint);margin-top:2px}
.trend .t{flex:1;min-width:0}
.trend .t b{display:block;font-weight:600;font-size:13.5px;line-height:1.35}
.trend .t span{font-size:12px;color:var(--muted)}

/* Members view */
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filterbar .search{width:min(320px,100%)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:500;font-size:13px;color:var(--text-2)}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.member{padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.member b{font-weight:600;margin-top:6px}
.member .hl{font-size:12.5px;color:var(--muted);min-height:36px}
.member .stat{font-size:12px;color:var(--faint)}
.member .btns{display:flex;gap:8px;margin-top:8px;width:100%}
.member .btns .btn{flex:1}
.online{position:relative}
.online::after{content:"";position:absolute;right:2px;bottom:2px;width:12px;height:12px;border-radius:50%;background:var(--success);border:2px solid var(--surface)}

/* Events view */
.event-card{display:flex;gap:16px;padding:16px;align-items:center}
.event-card .date-chip{width:64px;height:68px}
.event-card .date-chip b{font-size:24px}
.event-card .info{flex:1;min-width:0}
.event-card .info h3{font-size:16px}
.event-card .info .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:4px}
.event-card .info .meta span{display:inline-flex;align-items:center;gap:5px}
.event-card .going{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.event-card .rs{display:flex;flex-direction:column;gap:6px;align-items:flex-end}

/* Courses view */
.course{overflow:hidden;display:flex;flex-direction:column}
.course .cov{height:120px;background:var(--cover)}
.course .cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.course .cb h3{font-size:15.5px}
.course .cb p{font-size:13px;color:var(--muted)}
.course .cb .btn{margin-top:auto;align-self:flex-start}
.two{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

/* About view */
.about{padding:20px;display:flex;flex-direction:column;gap:12px;color:var(--text-2);font-size:14.5px}
.about h3{color:var(--text);font-size:15px}
.about ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* Drawer / overlays */
.scrim{position:fixed;inset:0;background:rgba(16,18,24,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:80;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.show{transform:none}
.drawer-h{height:var(--topbar-h);display:flex;align-items:center;gap:8px;padding:0 12px 0 20px;border-bottom:1px solid var(--border)}
.drawer-h h2{font-size:16px;flex:1}
.drawer-h .link{font-size:13px;color:var(--brand-ink);font-weight:500;padding:6px 8px;border-radius:6px}
.drawer-h .link:hover{background:var(--hover)}
.drawer-b{flex:1;overflow-y:auto}
.notif{display:flex;gap:12px;width:100%;padding:12px 20px;text-align:left;border-bottom:1px solid var(--border);align-items:flex-start;position:relative}
.notif:hover{background:var(--hover)}
.notif .txt{flex:1;min-width:0;font-size:13.5px;color:var(--text-2)}
.notif .txt b{color:var(--text);font-weight:600}
.notif .txt span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.notif[data-unread="true"]{background:var(--brand-soft)}
.notif[data-unread="true"]::after{content:"";position:absolute;right:16px;top:20px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.notif[data-unread="true"]:hover{background:var(--active)}
.notif .kind{position:absolute;left:44px;top:34px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:10px}
.notif-tabs{display:flex;gap:4px;padding:8px 20px;border-bottom:1px solid var(--border)}

/* DM popover */
.dm{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 32px));height:min(520px,calc(100% - 100px));background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);z-index:65;display:flex;flex-direction:column;overflow:hidden}
.dm-h{height:52px;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;border-bottom:1px solid var(--border)}
.dm-h h2{font-size:15px;flex:1;display:flex;align-items:center;gap:8px}
.dm-b{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.conv{display:flex;gap:10px;align-items:center;width:100%;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border)}
.conv:hover{background:var(--hover)}
.conv .t{flex:1;min-width:0}
.conv .t b{display:flex;justify-content:space-between;font-weight:600;font-size:13.5px}
.conv .t b span{font-weight:400;color:var(--muted);font-size:12px}
.conv .t p{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.conv[data-unread="true"] .t p{color:var(--text);font-weight:500}
.thread{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13.5px;background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--brand);color:var(--brand-text);align-self:flex-end;border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.msg time{display:block;font-size:10.5px;opacity:.7;margin-top:2px}
.dm-in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border)}
.dm-in input{flex:1;height:38px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);padding:0 14px;outline:none;min-width:0}
.dm-in input:focus{border-color:var(--brand);background:var(--surface)}

/* Command palette */
.palette{position:fixed;inset:0;z-index:90;display:flex;justify-content:center;align-items:flex-start;padding:min(14vh,120px) 16px 16px;background:rgba(16,18,24,.5)}
.pal{width:min(600px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;max-height:min(520px,100%);display:flex;flex-direction:column}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;height:56px;border-bottom:1px solid var(--border);color:var(--muted)}
.pal-in input{flex:1;border:0;background:transparent;font-size:16px;outline:none;color:var(--text);min-width:0}
.pal-list{overflow-y:auto;padding:8px}
.pal-hd{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px 10px 4px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.pal-item:hover,.pal-item[aria-selected="true"]{background:var(--hover)}
.pal-item .emoji{width:24px;text-align:center}
.pal-item .t{flex:1;min-width:0}
.pal-item .t b{display:block;font-weight:500}
.pal-item .t span{font-size:12px;color:var(--muted)}
.pal-item kbd{margin-left:auto}
.pal-empty{padding:24px;text-align:center;color:var(--muted)}
.pal-foot{display:flex;gap:14px;padding:8px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;font-size:13.5px;box-shadow:var(--shadow-lg);z-index:100;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:36px;margin-bottom:8px}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .page-inner{grid-template-columns:minmax(0,1fr);max-width:760px}
  .rail{display:none}

@media (max-width:800px){

  .sidebar.show{transform:none;box-shadow:var(--shadow-lg)}
  .hamb{display:grid}

  .space-body{padding:0 16px}

  .post{padding:14px 16px 10px}
  .event-card{flex-wrap:wrap}
  .event-card .rs{width:100%;flex-direction:row;justify-content:flex-start}
  .dm{right:16px}
  .theme-btn{display:none}
}

function postCard(p){
  const m = memberBy(p.a) || {role:''};
  const s = spaceBy(p.space);
  const liked = state.liked.has(p.id), saved = state.saved.has(p.id);
  let extra = '';
  if(p.type==='image') extra = `<div class="media" style="background:${p.media}" role="img" aria-label="Screenshot placeholder"><span class="cap">${esc(p.cap)}</span></div>`;
  if(p.type==='poll'){
    const v = state.votes[p.id]; const total = p.poll.votes + (v!==undefined?1:0);
    extra = `<div class="poll" role="radiogroup" aria-label="Poll">${p.poll.opts.map(([o,c],i)=>{ const n=c+(v===i?1:0); const pct=Math.round(n/total*100);
      return `<button class="opt" role="radio" aria-checked="${v===i}" data-vote="${i}" data-post="${p.id}" style="--w:${v!==undefined?pct:0}%"><span class="bar" aria-hidden="true"></span><span>${esc(o)}</span><span class="pct">${v!==undefined?pct+'%':''}</span></button>`;}).join('')}
      <div class="poll-meta">${fmt(total)} votes · ${v!==undefined?'You voted. Click again to change.':'Vote to see results · closes in 2 days'}</div></div>`;
  }
  if(p.type==='event'){ const e = events.find(x=>x.id===p.event); const on = state.rsvp.has(e.id);
    extra = `<div class="ev">${dateChip(e.d)}<div class="ev-meta"><b>${esc(e.t)}</b><span>${weekday(e.d)} · ${e.time} · ${e.loc}</span><span>${fmt(e.going+(on?1:0))} going</span></div><button class="btn ${on?'on':'primary'} sm" data-rsvp="${e.id}">${on?ico('check','ico sm')+'Going':'RSVP'}</button></div>`; }
  if(p.type==='course'){ const c = courses.find(x=>x.id===p.course); const pct = Math.round(c.done/c.lessons*100);
    extra = `<div class="course-inline"><div class="course-thumb" style="background:${c.cover}" aria-hidden="true"></div><div style="flex:1;min-width:0"><b>${esc(c.t)}</b><div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="--w:${pct}%"></i></div><div class="prog-lbl"><span>${c.done} of ${c.lessons} lessons</span><span>${pct}%</span></div></div><button class="btn ghost sm" data-view="courses">Continue</button></div>`; }
  const comments = p.cm ? `<div class="comments">${p.cm.map(c=>`<div class="cm">${av(c.a,'sm')}<div class="bubble"><div class="hd"><b>${esc(c.a)}</b><span>${c.ago}</span></div><p>${esc(c.t)}</p><div class="cm-acts"><button data-action="toast" data-msg="Liked comment">Like · ${c.likes}</button><button data-action="toast" data-msg="Reply box (mock)">Reply</button></div>
      ${c.r?`<div class="nested">${av(c.r.a,'xs')}<div class="bubble"><div class="hd"><b>${esc(c.r.a)}</b><span>${c.r.ago}</span></div><p>${esc(c.r.t)}</p></div></div>`:''}</div></div>`).join('')}
    <button class="view-all" data-action="toast" data-msg="Opening all ${p.comments} comments">View all ${p.comments} comments</button>
    <div class="cm-input">${av(ME,'sm')}<label class="sr" for="cm-${p.id}">Write a comment</label><input id="cm-${p.id}" type="text" placeholder="Write a comment…" data-comment="${p.id}"></div></div>` : '';
  return `<article class="card post ${p.pinned?'pinned':''}" data-post-id="${p.id}">
    <div class="post-top">${av(p.a)}<div class="post-who"><div class="n">${esc(p.a)}${m.role?`<span class="role">${m.role}</span>`:''}</div><div class="m">${p.pinned?`<span class="pin-tag">${ico('pin','ico sm')}Pinned</span><span>·</span>`:''}<span>${p.ago}</span><span>in</span><button class="sp" data-space="${s.id}">${s.e} ${esc(s.n)}</button></div></div>
      <div class="dd"><button class="icon-btn" data-menu="pm-${p.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Post options">${ico('more')}</button>
        <div class="menu" id="pm-${p.id}" role="menu" hidden>
          <button role="menuitem" data-action="toast" data-msg="Link copied">${ico('link')}Copy link</button>
          <button role="menuitem" data-action="toast" data-msg="Following post">${ico('bell')}Follow post</button>
          <button role="menuitem" data-action="toast" data-msg="${p.pinned?'Unpinned':'Pinned to top'} (admin)">${ico('pin')}${p.pinned?'Unpin':'Pin to top'}</button>
          <button role="menuitem" data-action="toast" data-msg="Hidden from your feed">${ico('eyeOff')}Hide</button>
          <hr><button role="menuitem" class="danger" data-action="toast" data-msg="Reported to moderators">${ico('flag')}Report</button>
        </div></div></div>
    <h2>${esc(p.title)}</h2>
    <p class="body">${p.body}</p>
    ${extra}
    <div class="reacts">${p.reacts.map(([e,c],i)=>`<button class="react" data-react="${p.id}:${i}" aria-pressed="${state[`r-${p.id}:${i}`]?'true':'false'}">${e} <span>${c+(state[`r-${p.id}:${i}`]?1:0)}</span></button>`).join('')}<button class="react" aria-label="Add reaction" data-action="toast" data-msg="Reaction picker (mock)">${ico('smile','ico sm')}</button></div>
    <div class="actions">
      <button class="act" data-like="${p.id}" aria-pressed="${liked}">${ico('heart','ico sm')}<span>${liked?'Liked':'Like'} · ${fmt(p.likes+(liked?1:0))}</span></button>
      <button class="act" data-action="toast" data-msg="Comments (mock)">${ico('comment','ico sm')}<span>${fmt(p.comments)}</span></button>
      <button class="act" data-action="toast" data-msg="Share link copied">${ico('share','ico sm')}<span>Share</span></button>
      <button class="act right icon-only" data-save="${p.id}" aria-pressed="${saved}" aria-label="${saved?'Remove bookmark':'Bookmark'}">${ico('bookmark','ico sm')}</button>
    </div>
    ${comments}
  </article>`;
}

function feedPosts(){
  let list = posts.filter(p=> state.view!=='space' || p.space===state.space);
  if(state.filter==='popular') list = list.filter(p=>p.likes>=40);
  if(state.filter==='pinned') list = list.filter(p=>p.pinned);
  if(state.sort==='liked') list = [...list].sort((a,b)=>b.likes-a.likes);
  if(state.sort==='oldest') list = [...list].reverse();
  if(state.sort==='latest') list = [...list.filter(p=>p.pinned), ...list.filter(p=>!p.pinned)];
  return list;
}

  if(state.mfilter==='online') list = list.filter(m=>m.online);
  return `<div class="filterbar">
    <div class="search"><svg class="ico sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><label class="sr" for="mq">Search members</label><input id="mq" type="text" placeholder="Search ${fmt(members.length)} members…" value="${esc(state.mq||'')}"></div>
    <div class="chips">${[['all','All'],['admins','Admins & mods'],['new','New this week'],['online','Online']].map(([k,l])=>`<button class="chip" data-mfilter="${k}" aria-pressed="${state.mfilter===k}">${l}</button>`).join('')}</div>

      <span class="hl">${esc(m.h)}</span>

      <div class="btns">${m.n===ME?`<button class="btn ghost sm" data-action="open-profile">Edit profile</button>`:`<button class="btn ${state.follow.has(m.n)?'on':'ghost'} sm" data-follow="${esc(m.n)}">${state.follow.has(m.n)?ico('check','ico sm')+'Following':'Follow'}</button><button class="btn soft sm" data-dm="${esc(m.n)}">Message</button>`}</div>
    </article>`).join('')}</div>

function aboutView(){
  const s = state.view==='space' ? spaceBy(state.space) : null;

function renderMain(){
  const inner = $('#pageInner'); const main = $('#main');
  const wide = ['members','events','courses','leaderboard','profile'].includes(state.view) || (state.view!=='feed' && state.view!=='space');
  inner.classList.toggle('wide', wide || (state.tab!=='posts' && state.tab!=='about'));
  let html = '';
  if(state.view==='members') html = `<h1 style="font-size:22px">Members</h1>` + membersView();
  else if(state.view==='events') html = `<h1 style="font-size:22px">Events</h1>` + eventsView();
  else if(state.view==='courses') html = `<h1 style="font-size:22px">Courses</h1>` + coursesView();
  else if(state.view==='leaderboard') html = `<h1 style="font-size:22px">Leaderboard</h1>` + leaderboardView();
  else if(state.view==='profile') html = profileView();
  else {
    html = spaceHeader();
    if(state.tab==='posts'){ const list = feedPosts(); html += composer() + sortRow(list.length) + (list.length ? list.map(postCard).join('') : `<div class="card empty"><div class="big">${spaceBy(state.space).e}</div>No posts here yet. Be the first to share something.</div>`); }
    else if(state.tab==='members') html += membersView();
    else if(state.tab==='events') html += eventsView();
    else if(state.tab==='about') html += aboutView();
  }
  main.innerHTML = html;
  $('#crumb').innerHTML = headerTitle();
  document.title = (state.view==='space' ? spaceBy(state.space).n+' · ' : state.view!=='feed' ? headerTitle().replace(/<[^>]+>/g,'').trim()+' · ' : '') + 'Maker Circle';
  renderRail();
  $('#page').scrollTop = 0;
}

    <section class="card"><div class="card-h"><h3>About this space</h3></div><div class="card-b"><p style="color:var(--text-2);font-size:13.5px">${esc(s?s.d:'Home shows the latest posts from every space you have joined.')}</p>

    <section class="card"><div class="card-h"><h3>Top members this week</h3><button class="more" data-view="leaderboard">Leaderboard</button></div><div class="card-b" style="padding-top:4px">
      ${top.map((m,i)=>`<div class="lb"><span class="rank ${i<3?'top':''}">${i+1}</span>${av(m.n,'sm')}<div class="who"><b>${esc(m.n)}</b><span>${m.role||'Member'}</span></div><span class="pts">${fmt(m.pts)}</span></div>`).join('')}</div></section>
    <section class="card"><div class="card-h"><h3>Trending</h3></div><div class="card-b" style="padding-top:4px">
      ${trending.map((p,i)=>`<button class="trend" data-space="${p.space}"><span class="n">${i+1}</span><span class="t"><b>${esc(p.title)}</b><span>${fmt(p.comments)} comments · ${spaceBy(p.space).e} ${esc(spaceBy(p.space).n)}</span></span></button>`).join('')}</div></section>`;

      <div class="dm-b">${convos.map(c=>`<button class="conv" data-thread="${c.id}" data-unread="${c.unread}">${av(c.a)}<span class="t"><b>${esc(c.a)}<span>${c.ago}</span></b><p>${esc(c.msgs[c.msgs.length-1].t)}</p></span></button>`).join('')}</div>`;
  } else {
    const c = convos.find(x=>x.id===state.dmThread);

    const th = $('#thread'); th.scrollTop = th.scrollHeight;
    $('#dmInput').focus();

}

function renderPalette(){
  const q = $('#palInput').value.trim().toLowerCase();
  const sp = allSpaces.filter(s=>!q||s.n.toLowerCase().includes(q));
  const mem = members.filter(m=>!q||m.n.toLowerCase().includes(q)||m.h.toLowerCase().includes(q)).slice(0,6);
  const ps = q ? posts.filter(p=>p.title.toLowerCase().includes(q)).slice(0,4) : [];
  const pages = [['feed','Home',I.home],['members','Members',I.users],['events','Events',I.cal],['courses','Courses',I.book],['leaderboard','Leaderboard',I.award]].filter(([,l])=>!q||l.toLowerCase().includes(q));
  let html = '';
  if(pages.length) html += `<div class="pal-hd">Pages</div>` + pages.map(([v,l,p])=>`<button class="pal-item" data-view="${v}"><span class="emoji"><svg class="ico sm" viewBox="0 0 24 24" style="margin:auto">${p}</svg></span><span class="t"><b>${l}</b></span></button>`).join('');
  if(sp.length) html += `<div class="pal-hd">Spaces</div>` + sp.map(s=>`<button class="pal-item" data-space="${s.id}"><span class="emoji">${s.e}</span><span class="t"><b>${esc(s.n)}</b><span>${fmt(s.c)} members</span></span></button>`).join('');
  if(mem.length) html += `<div class="pal-hd">Members</div>` + mem.map(m=>`<button class="pal-item" data-dm="${esc(m.n)}">${av(m.n,'xs')}<span class="t"><b>${esc(m.n)}</b><span>${esc(m.h)}</span></span><kbd>DM</kbd></button>`).join('');
  if(ps.length) html += `<div class="pal-hd">Posts</div>` + ps.map(p=>`<button class="pal-item" data-space="${p.space}"><span class="emoji">${spaceBy(p.space).e}</span><span class="t"><b>${esc(p.title)}</b><span>${esc(p.a)} · ${p.ago}</span></span></button>`).join('');
  $('#palList').innerHTML = html || '<div class="pal-empty">No results for “'+esc(q)+'”</div>';
  const first = $('#palList .pal-item'); if(first) first.setAttribute('aria-selected','true');
}
function openPalette(open){ const p=$('#palette'); p.hidden=!open; if(open){ $('#palInput').value=''; renderPalette(); $('#palInput').focus(); } }
function palMove(dir){ const items=$$('#palList .pal-item'); if(!items.length) return; let i=items.findIndex(x=>x.getAttribute('aria-selected')==='true'); items.forEach(x=>x.removeAttribute('aria-selected')); i=(i+dir+items.length)%items.length; items[i].setAttribute('aria-selected','true'); items[i].scrollIntoView({block:'nearest'}); }

/* ---------------- Theme ---------------- */
function applyTheme(t){
  const root=document.documentElement;
  if(t) root.setAttribute('data-theme',t); else root.removeAttribute('data-theme');
  const dark = t==='dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#themeBtn').setAttribute('aria-pressed',String(dark));
  $('#themeBtn .moon').hidden = dark; $('#themeBtn .sun').hidden = !dark;
}
let theme=null; try{ theme = localStorage.getItem('circle-shell-theme') || (document.documentElement.getAttribute('data-theme')||null); }catch(e){}
applyTheme(theme);
$('#themeBtn').addEventListener('click',()=>{ const dark = $('#themeBtn').getAttribute('aria-pressed')==='true'; theme = dark?'light':'dark'; applyTheme(theme); try{ localStorage.setItem('circle-shell-theme',theme);}catch(e){} });

/* ---------------- Navigation ---------------- */
function go(view, space){
  state.view = view; state.space = space||null; state.tab='posts'; state.filter='all';
  if(space){ const s=spaceBy(space); if(s) s.unread=false; }
  renderSidebar(); renderMain(); closeSidebar();
}
function closeMenus(except){ $$('.menu').forEach(m=>{ if(m!==except){ m.hidden=true; const b=$(`[data-menu="${m.id}"]`); if(b) b.setAttribute('aria-expanded','false'); } }); }
function closeSidebar(){ $('#sidebar').classList.remove('show'); $('#hambBtn').setAttribute('aria-expanded','false'); if(!$('#drawer').classList.contains('show')) $('#scrim').classList.remove('show'); }

/* ---------------- Events (delegated) ---------------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-menu],[data-action],[data-view],[data-space],[data-group],[data-tab],[data-sort],[data-filter],[data-like],[data-save],[data-react],[data-vote],[data-rsvp],[data-follow],[data-dm],[data-mfilter],[data-nfilter],[data-notif],[data-thread]');
  if(!e.target.closest('.menu') && !t?.dataset.menu) closeMenus();
  if(!t) return;
  const d = t.dataset;
  if(d.menu){ const m=$('#'+d.menu); const open=m.hidden; closeMenus(m); m.hidden=!open; t.setAttribute('aria-expanded',String(open)); return; }
  if(d.action){
    const a=d.action;
    if(a==='toast') toast(d.msg||'Done');
    if(a==='close-drawer') openDrawer(false);
    if(a==='close-dm'){ state.dmOpen=false; renderDM(); }
    if(a==='dm-back'){ state.dmThread=null; renderDM(); }
    if(a==='open-profile'){ go('profile'); }
    if(a==='open-composer'){ const c=$('#composer'); c.dataset.open='true'; $('#composerTitle').focus(); }
    if(a==='close-composer'){ $('#composer').dataset.open='false'; }
    if(a==='publish'){ const title=$('#composerTitle').value.trim(), body=$('#composerBody').value.trim(); if(!title&&!body){ toast('Add a title or some text first'); return; }
      posts.unshift({id:'p'+Date.now(), a:ME, space: state.view==='space'?state.space:'general', ago:'Just now', title: title||body.slice(0,60), body: esc(body), likes:0, comments:0, reacts:[], type:'text'}); renderMain(); toast('Published'); }
    closeMenus(); return;
  }
  if(d.group){ state.groupOpen[d.group] = !(state.groupOpen[d.group]!==false); try{localStorage.setItem('circle-shell-groups',JSON.stringify(state.groupOpen));}catch(err){} renderSidebar(); return; }
  if(d.space){ openPalette(false); go('space', d.space); return; }
  if(d.view){ openPalette(false); go(d.view); return; }
  if(d.tab){ state.tab=d.tab; renderMain(); return; }
  if(d.sort){ state.sort=d.sort; closeMenus(); renderMain(); return; }
  if(d.filter){ state.filter=d.filter; renderMain(); return; }
  if(d.like){ const p=posts.find(x=>x.id===d.like); state.liked.has(p.id)?state.liked.delete(p.id):state.liked.add(p.id); const liked=state.liked.has(p.id); t.setAttribute('aria-pressed',String(liked)); t.querySelector('span').textContent=`${liked?'Liked':'Like'} · ${fmt(p.likes+(liked?1:0))}`; return; }
  if(d.save){ const on=!state.saved.has(d.save); on?state.saved.add(d.save):state.saved.delete(d.save); t.setAttribute('aria-pressed',String(on)); t.setAttribute('aria-label',on?'Remove bookmark':'Bookmark'); toast(on?'Saved to bookmarks':'Removed from bookmarks'); return; }
  if(d.react){ const k='r-'+d.react; state[k]=!state[k]; const [pid,i]=d.react.split(':'); const p=posts.find(x=>x.id===pid); t.setAttribute('aria-pressed',String(state[k])); t.querySelector('span').textContent=p.reacts[+i][1]+(state[k]?1:0); return; }
  if(d.vote){ const cur=state.votes[d.post]; state.votes[d.post] = (cur===+d.vote) ? undefined : +d.vote; if(state.votes[d.post]===undefined) delete state.votes[d.post]; const card=t.closest('.post'); card.outerHTML = postCard(posts.find(p=>p.id===d.post)); return; }
  if(d.rsvp){ state.rsvp.has(d.rsvp)?state.rsvp.delete(d.rsvp):state.rsvp.add(d.rsvp); toast(state.rsvp.has(d.rsvp)?'You are going':'RSVP removed'); renderMain(); return; }
  if(d.follow){ state.follow.has(d.follow)?state.follow.delete(d.follow):state.follow.add(d.follow); renderMain(); return; }
  if(d.dm){ openPalette(false); const c = convos.find(x=>x.a===d.dm) || (convos.push({id:'d'+Date.now(), a:d.dm, ago:'Now', unread:false, msgs:[]}), convos[convos.length-1]); state.dmOpen=true; state.dmThread=c.id; c.unread=false; renderDM(); return; }
  if(d.mfilter){ state.mfilter=d.mfilter; renderMain(); return; }
  if(d.nfilter){ state.nfilter=d.nfilter; $$('[data-nfilter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.nfilter===d.nfilter))); renderNotifs(); return; }
  if(d.notif){ const n=notifications.find(x=>x.id===+d.notif); n.unread=false; renderNotifs(); toast('Opening notification'); return; }
  if(d.thread){ state.dmThread=d.thread; convos.find(c=>c.id===d.thread).unread=false; renderDM(); return; }
});

document.addEventListener('input', e=>{
  if(e.target.id==='mq'){ state.mq=e.target.value; const grid=$('.grid'); const tmp=document.createElement('div'); tmp.innerHTML=membersView(); grid.replaceWith(tmp.querySelector('.grid')); $('.filterbar .count').textContent = tmp.querySelector('.filterbar .count').textContent; }
  if(e.target.id==='palInput') renderPalette();
});
document.addEventListener('submit', e=>{
  if(e.target.id==='dmForm'){ e.preventDefault(); const inp=$('#dmInput'); const v=inp.value.trim(); if(!v) return; const c=convos.find(x=>x.id===state.dmThread); c.msgs.push({me:true,t:v,at:'Now'}); c.ago='Now'; inp.value=''; renderDM();
    setTimeout(()=>{ if(state.dmThread===c.id){ c.msgs.push({me:false,t:['On it 👍','Sounds good, thanks!','Let me check and get back to you.'][c.msgs.length%3],at:'Now'}); renderDM(); } },1400); }
});
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette($('#palette').hidden); return; }
  if(e.key==='Escape'){ openPalette(false); openDrawer(false); closeMenus(); closeSidebar(); if(state.dmOpen){state.dmOpen=false; renderDM();} return; }
  if(!$('#palette').hidden){
    if(e.key==='ArrowDown'){ e.preventDefault(); palMove(1); }
    if(e.key==='ArrowUp'){ e.preventDefault(); palMove(-1); }
    if(e.key==='Enter'){ e.preventDefault(); const sel=$('#palList .pal-item[aria-selected="true"]'); if(sel) sel.click(); }
  }
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.comment){ const v=e.target.value.trim(); if(!v) return; const p=posts.find(x=>x.id===e.target.dataset.comment); p.cm.push({a:ME, ago:'Just now', t:v, likes:0}); p.comments++; renderMain(); toast('Comment posted'); }
});
$('#searchBtn').addEventListener('click', ()=>openPalette(true));
$('#palette').addEventListener('click', e=>{ if(e.target===e.currentTarget) openPalette(false); });
$('#bellBtn').addEventListener('click', ()=>openDrawer(!$('#drawer').classList.contains('show')));
$('#scrim').addEventListener('click', ()=>{ openDrawer(false); closeSidebar(); });
$('#markAll').addEventListener('click', ()=>{ notifications.forEach(n=>n.unread=false); renderNotifs(); toast('All notifications marked as read'); });
$('#dmBtn').addEventListener('click', ()=>{ state.dmOpen=!state.dmOpen; renderDM(); });
$('#newPostBtn').addEventListener('click', ()=>{ if(!['feed','space'].includes(state.view)) go('feed'); state.tab='posts'; renderMain(); const c=$('#composer'); c.dataset.open='true'; c.scrollIntoView({block:'center'}); $('#composerTitle').focus(); });
$('#hambBtn').addEventListener('click', ()=>{ const open=!$('#sidebar').classList.contains('show'); $('#sidebar').classList.toggle('show',open); $('#hambBtn').setAttribute('aria-expanded',String(open)); $('#scrim').classList.toggle('show',open); });

/* ---------------- Boot ---------------- */
renderSidebar(); renderMain(); renderNotifs(); renderDM();
})();
</script>
